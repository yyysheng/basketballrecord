<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>CourtFlow Pro · Match Desk V4</title>
<style>
:root{color-scheme:light;--ink:#172334;--muted:#66758a;--line:#d9e1ec;--paper:#fff;--canvas:#f3f6fb;--blue:#2463eb;--blue-dark:#1749b7;--red:#bd3f50;--green:#18815c;--shadow:0 12px 34px #1932511a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--canvas);overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
#app{height:100%;min-height:0}
.app-shell{height:100dvh;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:8px}
.topbar{display:flex;align-items:center;gap:7px;min-height:52px;padding:6px 8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #1932510d;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.score-team{display:flex;align-items:center;gap:8px;min-width:140px;padding:4px 8px;border-radius:10px;font-weight:750}
.score-team.home{background:#e8f1ff}.score-team.away{background:#fff0f2}
.score-name{max-width:145px;overflow:hidden;text-overflow:ellipsis}
.score-total{font-size:25px;font-variant-numeric:tabular-nums;line-height:1}
.period-pill{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-weight:800;background:#fff;min-width:58px;text-align:center}
.toolbar-btn,.action-btn,.mini-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 10px;min-height:36px;font-weight:680;white-space:nowrap}
.toolbar-btn:hover,.action-btn:hover,.mini-btn:hover{border-color:#98aed0;background:#f7faff}
.toolbar-btn.primary,.action-btn.primary{background:var(--blue);border-color:var(--blue);color:white}
.toolbar-btn.primary:hover,.action-btn.primary:hover{background:var(--blue-dark)}
.toolbar-btn.danger,.action-btn.danger{color:var(--red)}
.main-area{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-height:0;position:relative}
.table-pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.table-caption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);min-height:34px}
.table-caption strong{color:#35455b}
.table-scroll{flex:1;min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain}
.stats-table{border-collapse:separate;border-spacing:0;width:100%;min-width:1160px;table-layout:fixed;font-size:12px}
.stats-table th,.stats-table td{border-right:1px solid #e8edf4;border-bottom:1px solid #e8edf4;text-align:center;padding:3px}
.stats-table thead th{position:sticky;z-index:5;background:#f7f9fc;color:#344256;font-weight:800}
.stats-table thead tr:first-child th{top:0;height:34px;border-bottom-color:#d8e1ed}
.stats-table thead tr:nth-child(2) th{top:34px;height:28px;font-size:10px;color:#748196}
.stats-table th.identity-head{z-index:8}
.stats-table td{height:48px}
.stats-table .number-col{position:sticky;left:0;z-index:4;width:48px;min-width:48px;background:var(--row-bg,#fff);font-weight:850;font-size:15px}
.stats-table .player-col{position:sticky;left:48px;z-index:4;width:142px;min-width:142px;text-align:left;background:var(--row-bg,#fff);overflow:hidden}
.stats-table thead .number-col{left:0;z-index:9}
.stats-table thead .player-col{left:48px;z-index:9}
.player-col:before{content:attr(data-watermark);position:absolute;left:6px;top:-7px;font-size:49px;line-height:1;font-weight:900;letter-spacing:-4px;color:#26415e;opacity:.075;pointer-events:none;z-index:0}
.player-label{position:relative;z-index:1;display:block;max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:740;color:#26364b}
.team-band th{position:sticky;left:0;text-align:left!important;padding:6px 10px!important;color:#344256;background:#f5f8fc;z-index:3;height:28px}
.team-band .team-name{font-size:12px;font-weight:850}
.team-band .team-count{font-size:10px;color:var(--muted);font-weight:600;margin-left:8px}
.stat-col{width:39px;min-width:39px}
.single-col{width:42px;min-width:42px}
.stat-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:visible}
.stat-button{position:relative;z-index:1;width:33px;height:36px;min-width:33px;border:1px solid #cfd8e5;border-radius:7px;background:#fff;color:#26374b;font-size:18px;font-weight:850;line-height:1;touch-action:manipulation;transition:background .12s,border-color .12s,transform .08s}
.stat-button:hover{background:#f2f6fc;border-color:#9eafc6}
.stat-button:active{transform:scale(.93)}
.stat-button.mark-made{background:#e2f5ed;border-color:#75bd9e;color:#126444}
.stat-button.mark-miss{background:#fff0f0;border-color:#e6a0a0;color:#ad3333}
.feedback{position:absolute;right:calc(100% + 3px);top:50%;transform:translateY(-50%);z-index:7;pointer-events:none;white-space:nowrap;color:#23344b;opacity:.55;font-weight:850;font-size:13px;animation:feedback-in .18s ease-out}
@keyframes feedback-in{from{opacity:0;transform:translate(6px,-50%)}to{opacity:.55;transform:translate(0,-50%)}}
.bottom-actions{display:flex;align-items:center;gap:6px;min-height:40px;overflow-x:auto;white-space:nowrap}
.bottom-actions .spacer{flex:1}
.save-status{font-size:11px;color:var(--muted);padding:0 6px}
.notes-panel{position:fixed;z-index:25;right:8px;top:70px;bottom:56px;width:min(370px,calc(100vw - 16px));min-width:min(260px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transform:translateX(calc(100% + 20px));transition:transform .18s ease;overflow:hidden}
.notes-panel.drawer-open{transform:translateX(0)}
.notes-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line)}
.notes-head h2{font-size:15px;margin:0}
.notes-list{flex:1;overflow:auto;padding:8px}
.note-card{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px;background:#fbfcfe}
.note-card.resolved{opacity:.67;background:#f3f6f9}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.45}
.note-meta{font-size:10px;color:var(--muted);margin-top:6px}
.note-controls{display:flex;gap:5px;margin-top:8px}
.mini-btn{min-height:29px;padding:4px 7px;font-size:11px}
.note-form{border-top:1px solid var(--line);padding:9px;display:grid;gap:6px}
.note-form textarea,.form-field input,.form-field select,.modal input,.modal select,.modal textarea{width:100%;border:1px solid #ccd6e3;border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
.note-form textarea{min-height:64px;resize:vertical}
.note-form select{min-height:34px;border:1px solid #ccd6e3;border-radius:8px;padding:6px;background:white}
.overlay{position:fixed;inset:0;background:#10203366;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:min(620px,100%);max-height:min(92dvh,900px);display:flex;flex-direction:column;background:white;border-radius:16px;box-shadow:0 24px 70px #07172b55;overflow:hidden}
.modal.wide{width:min(1050px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:17px;margin:0}
.modal-body{padding:14px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.setup-page{height:100dvh;overflow:auto;padding:clamp(12px,2vw,24px)}
.setup-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1160px;margin:0 auto 12px}
.setup-top h1{font-size:20px;margin:0}
.setup-top p{font-size:12px;color:var(--muted);margin:3px 0 0}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1160px;margin:0 auto}
.setup-card{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.setup-card-head{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:end}
.form-field{display:grid;gap:4px;font-size:11px;font-weight:750;color:#56657a}
.form-field input,.form-field select{min-height:36px}
.form-field input[type=color]{padding:3px;height:36px}
.roster-head,.roster-line{display:grid;grid-template-columns:52px minmax(0,1fr) 68px 32px;gap:6px;align-items:center}
.roster-head{font-size:10px;font-weight:800;color:var(--muted);padding:10px 2px 4px}
.roster-line{padding:3px 0}
.roster-line input[type=text]{min-width:0;width:100%;height:34px;border:1px solid #d0d9e5;border-radius:7px;padding:5px 7px}
.roster-line input[type=checkbox]{width:18px;height:18px;justify-self:center}
.roster-line .remove-player{width:30px;height:30px;border:1px solid #e0e6ee;background:#fff;border-radius:7px;color:#a3333b}
.roster-actions{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:10px;color:var(--muted)}
.setup-submit{max-width:1160px;margin:12px auto;display:flex;justify-content:flex-end;gap:8px}
.setup-error{max-width:1160px;margin:8px auto;color:#a12636;font-size:12px;font-weight:700}
.empty{padding:16px;color:var(--muted);font-size:12px;text-align:center}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.history-list{border-collapse:collapse;width:100%;font-size:12px}
.history-list th,.history-list td{border-bottom:1px solid #e7edf4;padding:7px 6px;text-align:left;vertical-align:top}
.history-list th{position:sticky;top:0;background:#f5f8fc;z-index:1}
.history-list .muted{color:var(--muted);font-size:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 7px;background:#eef2f7;font-size:10px;font-weight:750}
.pill.good{background:#e2f5ed;color:#126444}.pill.bad{background:#fff0f0;color:#a3333b}
.stat-summary{border-collapse:collapse;width:100%;font-size:11px;min-width:900px}
.stat-summary th,.stat-summary td{border-bottom:1px solid #e6ecf3;padding:6px 5px;text-align:center}
.stat-summary th{position:sticky;top:0;background:#f5f8fc;z-index:1}
.toast{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);z-index:90;background:#172334;color:white;padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;max-width:min(90vw,600px)}
.rotate-overlay{display:none}
.small-note{font-size:11px;color:var(--muted);line-height:1.45}
.danger-text{color:#ad3333}
.mobile-close{display:inline-flex}
@media (min-width:1480px){
 .main-area{grid-template-columns:minmax(0,1fr) 280px}
 .notes-panel{position:static;transform:none;transition:none;width:280px;min-width:260px;box-shadow:none;grid-column:2;grid-row:1}
 .notes-panel.drawer-open{transform:none}
 .mobile-close{display:none}
}
@media (max-width:820px){
 .app-shell{padding:5px;gap:5px;grid-template-rows:auto minmax(0,1fr) auto}
 .topbar{gap:5px;padding:5px;min-height:47px;border-radius:10px}
 .score-team{min-width:116px;padding:4px 6px;gap:5px;font-size:12px}
 .score-name{max-width:86px}.score-total{font-size:21px}
 .period-pill{min-width:51px;padding:7px 6px;font-size:12px}
 .toolbar-btn{min-height:36px;padding:6px 8px;font-size:11px}
 .table-caption{min-height:29px;padding:5px 8px}
 .stats-table{min-width:1170px}
 .stats-table td{height:52px}
 .stat-button{width:39px;height:42px;min-width:39px;font-size:19px;border-radius:8px}
 .stat-col{width:44px;min-width:44px}.single-col{width:46px;min-width:46px}
 .stats-table .number-col{width:50px;min-width:50px}
 .stats-table .player-col{left:50px;width:142px;min-width:142px}
 .stats-table thead .player-col{left:50px}
 .stats-table thead .number-col{left:0}
 .bottom-actions{min-height:36px}
}
@media (max-width:760px){
 .setup-grid{grid-template-columns:minmax(0,1fr)}
 .setup-top h1{font-size:18px}
}
@media (orientation:portrait){
 .rotate-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:28px;background:#101d30;color:#fff;text-align:center}
 .rotate-card{max-width:330px}
 .rotate-card .icon{font-size:56px}
 .rotate-card h2{font-size:22px;margin:10px 0}
 .rotate-card p{color:#c7d2e1;line-height:1.6;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Explicit shared column geometry prevents overlapping controls. */
.stats-table{width:1192px;min-width:1192px;table-layout:fixed}
.stats-table th,.stats-table td{padding:2px;width:auto;min-width:0}
.stats-table .number-col{width:44px;min-width:44px;left:0}
.stats-table .player-col{width:90px;min-width:90px;left:44px}
.stats-table thead .player-col{left:44px}
.player-label{width:5em;max-width:5em;font-size:14px;cursor:help}
.player-col:before{content:none}
.stat-button{width:40px;min-width:40px;height:42px;isolation:isolate;overflow:hidden;border-radius:5px}
.number-watermark{position:absolute;inset:0;display:grid;place-items:center;z-index:0;font-size:28px;letter-spacing:-2px;font-weight:900;color:var(--kit-ink,#26415e);opacity:.09;pointer-events:none}
.cell-mark{position:relative;z-index:1;pointer-events:none}
.player-row td{background:var(--row-bg)}
.team-band th{color:var(--kit-ink,#344256)}
.feedback{z-index:15}
.needs-review{border:2px solid #c43849;background:#fff5f6}
.event-filters{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.note-card details{font-size:11px;margin-top:7px;overflow-wrap:anywhere}
.foul-menu{position:fixed;z-index:110;width:270px;max-height:280px;overflow:auto;padding:10px;display:grid;gap:6px;background:white;border:1px solid #b9c8db;border-radius:10px;box-shadow:var(--shadow)}
.foul-menu strong{font-size:12px}
.modal>form{overflow:auto;min-height:0}
@media(min-width:1480px){.main-area{grid-template-columns:minmax(1192px,1fr) 280px}}
@media(min-width:1480px) and (max-width:1503px){.main-area{grid-template-columns:minmax(0,1fr)}.notes-panel{position:fixed;transform:translateX(calc(100% + 20px));width:280px}.notes-panel.drawer-open{transform:none}.mobile-close{display:inline-flex}}


/* ===============================================================
   COURTFLOW PRO / EDITORIAL TABLE DESIGN V2
   Visual-only reconstruction: app data/state/event APIs untouched.
   =============================================================== */
:root{
 --ink:#15263d; --muted:#7c8a9e; --line:#e3e9f2; --paper:#fff;
 --canvas:#f3f6fb; --blue:#356de8; --blue-dark:#2354c8;
 --red:#b94353; --green:#167958;
 --shadow:0 12px 44px rgba(24,48,82,.055);
 --table-min:1128px; --sidebar-width:298px;
}
html{background:#f3f6fb}
body{background:radial-gradient(circle at 14% -15%,#e9f0ff 0,transparent 31%),linear-gradient(180deg,#f8fafd 0,#f3f6fa 47%,#f1f5f9 100%);font-size:12px;-webkit-font-smoothing:antialiased}
.app-shell{padding:10px;gap:10px}
.topbar{height:60px;min-height:60px;gap:8px;padding:8px 10px;border:1px solid #e5eaf2;border-radius:16px;box-shadow:0 4px 20px rgba(23,46,75,.035);scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.score-team{height:41px;min-width:124px;max-width:218px;gap:8px;padding:5px 11px 5px 12px;border-radius:11px;position:relative;border:1px solid color-mix(in srgb,var(--team-main,#477dcf) 18%,transparent);background:color-mix(in srgb,var(--team-main,#477dcf) 8%,white)!important}
.score-team::before{content:"";position:absolute;inset:9px auto 9px 0;width:3px;background:var(--team-main,#477dcf);border-radius:0 4px 4px 0}
.score-name{font-size:12px;font-weight:800;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-total{font-size:24px;letter-spacing:-.7px;font-weight:900;line-height:1;color:var(--team-ink,var(--ink))}
.score-team.away{justify-content:flex-end}
.period-pill{background:#f6f8fc;border:1px solid #e8edf4;height:40px;display:grid;place-items:center;min-width:68px;border-radius:10px;font-size:12px;letter-spacing:.03em;white-space:nowrap}
.toolbar-btn{height:39px;min-height:39px;padding:7px 12px;font-size:12px;font-weight:780;border:1px solid #e1e7f0;border-radius:10px;box-shadow:0 1px 1px #15233808}
.toolbar-btn.primary{box-shadow:0 4px 12px #356de81f}
.toolbar-btn:hover{transform:translateY(-1px)}
.toolbar-btn:active{transform:translateY(0)}
.main-area{gap:10px;grid-template-columns:minmax(0,1fr)}
.table-pane,.notes-panel{background:#fff;border:1px solid #e1e8f2;border-radius:16px;box-shadow:var(--shadow)}
.table-pane{overflow:hidden}
.table-caption{height:40px;min-height:40px;padding:0 16px;background:#fff;color:#7b8aa0;font-size:11px;border-bottom:1px solid #eaf0f6}
.table-caption strong{font-size:12px;letter-spacing:.03em;color:#253b55;display:inline-flex;align-items:center;gap:9px}
.table-caption strong::before{content:"";width:7px;height:7px;background:#3a78ef;border-radius:3px;box-shadow:0 0 0 4px #eff5ff}
.table-scroll{scrollbar-color:#cbd7e6 transparent;scrollbar-width:thin;overflow:auto}
.stats-table{width:100%!important;min-width:var(--table-min)!important;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px}
.stats-table th,.stats-table td{padding:2px!important;min-width:0!important;width:auto;border-bottom:1px solid #e8edf4;border-right:1px solid transparent;text-align:center}
.stats-table col.col-num{width:42px}
.stats-table col.col-player{width:96px}
.stats-table col.col-stat{width:42px}
.stats-table col.col-single{width:45px}
.stats-table .number-col{width:42px!important;min-width:42px!important;left:0!important;font-weight:900;color:#2f435b;font-size:14px}
.stats-table .player-col{width:96px!important;min-width:96px!important;left:42px!important;text-align:left;padding:2px 7px!important}
.player-col:before{display:none}
.player-label{font-size:13px;line-height:1.2;width:5em;max-width:5em;letter-spacing:-.2px;color:#243951;font-weight:750}
.player-row td{height:clamp(51px,calc((100dvh - 225px)/10),68px);background:#fff;border-bottom:1px solid #edf1f6}
.player-row:nth-child(odd) td:not(.number-col):not(.player-col){background:#fbfcfe}
.player-row .number-col,.player-row .player-col{background:var(--team-soft,#f0f5ff)!important}
.player-row .number-col{color:var(--team-ink,#2f435b);border-left:3px solid color-mix(in srgb,var(--team-main,#356de8) 68%,white)!important}
.player-row .player-col{box-shadow:5px 0 9px -9px rgba(10,37,75,.34)}
/* A single header line belongs to each team, eliminating old slot numbers. */
.table-caption{display:none!important}
.team-band th{position:sticky;top:0;height:44px!important;z-index:6;padding:5px 3px!important;border-bottom:1px solid #dde6f0!important;background:linear-gradient(180deg,#fafcfe,#f5f8fd);color:#4a5b70;font-size:11px;line-height:1.05;white-space:nowrap}
.team-band .team-identity{left:0;z-index:9;text-align:left!important;padding:4px 9px!important;border-left:3px solid var(--team-main,#356de8)!important;background:var(--team-soft,#f0f5ff)!important;overflow:hidden}
.team-identity .team-label-top{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900;color:var(--team-ink,#234571);white-space:nowrap}
.team-identity .team-label-top .team-dot{width:7px;height:7px;border-radius:100px;flex:none;background:var(--team-main,#356de8)}
.team-identity .team-label-name{display:block;margin:3px 0 0 12px;font-size:10px;font-weight:700;color:var(--team-ink,#546b87);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:112px}
.team-band .group-heading{font-weight:760;letter-spacing:-.25px;color:#4a5a70;font-size:11px;position:sticky;top:0;z-index:6}
.team-band .group-heading.group-shot{background:#f4f7fd;color:#355171}
.team-band .group-heading.group-board{background:#f8f9fc;color:#526178}
.team-band .group-heading.group-action{font-size:10.6px}
.team-band .group-heading.group-discipline{background:#faf9f9;color:#6e5961;font-size:10px;white-space:normal;line-height:1.08}
.stats-table .group-start{border-left:2px solid #c9d3e2!important}
.stats-table .group-end{border-right:1px solid #e2e8f0!important}
.stat-wrap{width:100%;height:100%;min-height:39px;display:flex;justify-content:center;align-items:center}

<body>
<div id="app" aria-live="polite"></div>
<div class="rotate-overlay"><div class="rotate-card"><div class="icon">↻</div><h2>请使用横屏布局或扩大浏览器宽度</h2><p>CourtFlow Pro 的统计格为横屏操作设计。调整为横屏比例后即可继续登记，已登记数据保持保存。</p></div></div>
<script>
(function(){
'use strict';
const STORAGE_KEY='courtflow-pro-table-v1';
const HOLD_MS=3000;
const TYPE_META={
 shot2:{label:'两分',kind:'shot',points:2},
 shot3:{label:'三分',kind:'shot',points:3},
 freeThrow:{label:'罚球',kind:'shot',points:1},
 offRebound:{label:'进攻篮板',kind:'stat'},
 defRebound:{label:'防守篮板',kind:'stat'},
 assist:{label:'助攻',kind:'stat'},
 steal:{label:'抢断',kind:'stat'},
 block:{label:'盖帽',kind:'stat'},
 turnover:{label:'失误',kind:'stat'},
 personalFoul:{label:'普通犯规',kind:'stat'},
 otherFoul:{label:'其他犯规',kind:'stat'},
 violation:{label:'违例',kind:'stat'},
 substitution:{label:'换人',kind:'sub'}
};
const SHOT_TYPES=['shot2','shot3','freeThrow'];
const STAT_GROUPS=[
 {type:'shot2',label:'2分',slots:4,group:'stat-col'},
 {type:'shot3',label:'3分',slots:4,group:'stat-col'},
 {type:'freeThrow',label:'罚球',slots:2,group:'stat-col'},
 {type:'offRebound',label:'进攻篮板',slots:3,group:'stat-col'},
 {type:'defRebound',label:'防守篮板',slots:3,group:'stat-col'},
 {type:'assist',label:'助攻',slots:1,group:'single-col'},
 {type:'steal',label:'抢断',slots:1,group:'single-col'},
 {type:'block',label:'盖帽',slots:1,group:'single-col'},
 {type:'turnover',label:'失误',slots:1,group:'single-col'},
 {type:'personalFoul',label:'普通犯规',slots:1,group:'single-col'},
 {type:'otherFoul',label:'其他犯规',slots:1,group:'single-col'},
 {type:'violation',label:'违例',slots:1,group:'single-col'}
];
const SIDES=['home','away'];
const SIDE_LABEL={home:'主队',away:'客队'};
const app=document.getElementById('app');
const ui={modal:null,drawerOpen:false,toast:'',toastUntil:0,formError:'',expiryTimer:null};

function uid(){
 if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID();
 return 'cf-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
}
function clone(value){return JSON.parse(JSON.stringify(value));}
function escapeHtml(value){
 return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,function(ch){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
 });
}
function makeRoster(side){
 const players=[];
 for(let i=1;i<=8;i++)players.push({id:uid(),number:String(i),name:'',side:side});
 return players;
}
function makeTeam(side,name,color){
 return {id:side,name:name,color:color,roster:makeRoster(side)};
}
function freshState(){
 const home=makeTeam('home','主队','#dceaff');
 const away=makeTeam('away','客队','#ffe4e8');
 return {
  schema:1,gameId:uid(),createdAt:Date.now(),started:false,period:1,
  teams:{home:home,away:away},
  startingLineups:{home:home.roster.slice(0,5).map(function(p){return p.id;}),away:away.roster.slice(0,5).map(function(p){return p.id;})},
  events:[],corrections:[],cells:{},feedback:{},undoStack:[],sequence:1
 };
}
function validState(value){
 return !!value&&value.schema===1&&typeof value.gameId==='string'&&value.teams&&
  value.teams.home&&Array.isArray(value.teams.home.roster)&&value.teams.away&&Array.isArray(value.teams.away.roster)&&
  Array.isArray(value.events)&&Array.isArray(value.corrections);
}
function loadState(){
 let raw='';
 try{raw=localStorage.getItem(STORAGE_KEY)||'';}catch(e){return {state:freshState(),canSave:false,error:'浏览器本地存储不可用。请在普通浏览模式下打开。'};}
 if(!raw)return {state:freshState(),canSave:true,error:''};
 try{
  const saved=JSON.parse(raw);
  if(!validState(saved))return {state:freshState(),canSave:false,error:'新版本存档格式无法识别。原数据未改动；请先导出或检查本地备份。'};
  saved.startingLineups=saved.startingLineups||{home:saved.teams.home.roster.slice(0,5).map(function(p){return p.id;}),away:saved.teams.away.roster.slice(0,5).map(function(p){return p.id;})};
  saved.cells=saved.cells||{};saved.feedback=saved.feedback||{};saved.undoStack=saved.undoStack||[];saved.sequence=saved.sequence||1;
  return {state:saved,canSave:true,error:''};
 }catch(e){return {state:freshState(),canSave:false,error:'本地新版本存档损坏；原数据未覆盖。请使用 JSON 备份恢复。'};}
}
const loaded=loadState();
let state=loaded.state;
let persistenceEnabled=loaded.canSave;
function setupDraftFromState(){
 const result={};
 SIDES.forEach(function(side){
  const t=clone(state.teams[side]);
  t.starterIds=(state.startingLineups&&state.startingLineups[side]||t.roster.slice(0,5).map(function(p){return p.id;})).slice();
  result[side]=t;
 });
 return result;
}
let setupDraft=setupDraftFromState();

function now(){return Date.now();}
function save(){
 if(!persistenceEnabled)return false;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true;}
 catch(e){ui.toast='保存失败：浏览器存储空间不足，请导出 JSON 备份。';ui.toastUntil=now()+3500;return false;}
}
function commitRender(message){
 if(message){ui.toast=message;ui.toastUntil=now()+2300;}
 save();render();
}
function setToast(message){
 ui.toast=message;ui.toastUntil=now()+2500;render();
}
function team(side){return state.teams[side];}
function findPlayer(playerId){
 for(let i=0;i<SIDES.length;i++){
  const t=team(SIDES[i]);const found=t.roster.find(function(p){return p.id===playerId;});
  if(found)return found;
 }
 return null;
}
function playerSide(playerId){const p=findPlayer(playerId);return p?p.side:null;}
function playerTitle(playerId){
 const p=findPlayer(playerId);if(!p)return '未知球员';
 const name=String(p.name||'').trim();
 return '#'+p.number+(name?' '+name:'');
}
function sideColor(side){
 const color=team(side).color||'#e9eef5';
 if(!/^#[0-9a-fA-F]{6}$/.test(color))return 'rgba(235,240,247,.7)';
 const rgb=[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16)];
 return 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',.22)';
}
function getLineup(side){
 const lineup=(state.startingLineups[side]||[]).slice();
 state.events.slice().sort(function(a,b){return (a.sequence||0)-(b.sequence||0);}).forEach(function(e){
  if(e.type!=='substitution'||e.teamId!==side||e.state!=='valid'||!e.data)return;
  const outIndex=lineup.indexOf(e.data.outId);
  if(outIndex<0||lineup.indexOf(e.data.inId)>=0)return;
  lineup.splice(outIndex,1,e.data.inId);
 });
 return lineup;
}
function getEvent(eventId){return state.events.find(function(e){return e.id===eventId;})||null;}
function isShot(type){return SHOT_TYPES.indexOf(type)>=0;}
function activeEvent(e){
 if(!e||e.state==='void')return false;
 if(isShot(e.type))return e.state==='made'||e.state==='miss';
 if(e.type==='substitution')return e.state==='valid';
 return e.state==='valid';
}
function getPlayerStats(playerId){
 const s={points:0,shot2Made:0,shot2Att:0,shot3Made:0,shot3Att:0,ftMade:0,ftAtt:0,offRebound:0,defRebound:0,assist:0,steal:0,block:0,turnover:0,personalFoul:0,otherFoul:0,violation:0};
 state.events.forEach(function(e){
  if(e.playerId!==playerId||!activeEvent(e))return;
  if(e.type==='shot2'){s.shot2Att++;if(e.state==='made'){s.shot2Made++;s.points+=2;}}
  else if(e.type==='shot3'){s.shot3Att++;if(e.state==='made'){s.shot3Made++;s.points+=3;}}
  else if(e.type==='freeThrow'){s.ftAtt++;if(e.state==='made'){s.ftMade++;s.points++;}}
  else if(e.state==='valid'&&Object.prototype.hasOwnProperty.call(s,e.type))s[e.type]++;
 });
 return s;
}
function teamScore(side){
 let score=0;
 state.events.forEach(function(e){

function cellKey(playerId,type,slot){return playerId+'|'+type+'|'+slot;}
function eventMark(e){
 if(!e)return '';
 if(isShot(e.type))return e.state==='made'?'√':(e.state==='miss'?'×':'');
 return e.state==='valid'?'√':(e.state==='void'?'×':'');
}
function feedbackFor(key){

 return item&&item.until>now()?item:null;
}
function writeFeedback(key,text){
 state.feedback[key]={text:text,until:now()+HOLD_MS,nonce:uid()};
}
function addEvent(teamId,playerId,type,eventState,data){
 const e={id:uid(),gameId:state.gameId,teamId:teamId,playerId:playerId||null,period:state.period,type:type,state:eventState,createdAt:now(),updatedAt:now(),sequence:state.sequence++,data:data||null,revisions:[]};
 state.events.push(e);
 return e;
}
function snapshotEvent(e){return clone(e);}
function addUndo(eventId,before,cell,cellBefore,extra){
 const entry={eventId:eventId,before:before?clone(before):null,cell:cell||null,cellBefore:cellBefore?clone(cellBefore):null};
 if(extra)Object.assign(entry,clone(extra));
 state.undoStack.push(entry);
 if(state.undoStack.length>250)state.undoStack.shift();
}
function reviseEvent(e,changes){
 e.revisions=e.revisions||[];
 e.revisions.push({at:now(),snapshot:snapshotEvent(e)});
 Object.assign(e,changes);e.updatedAt=now();
}
function handleStatClick(playerId,type,slot){
 if(!findPlayer(playerId)||!TYPE_META[type])return;
 const key=cellKey(playerId,type,slot);
 const currentCell=state.cells[key]||null;
 const cellBefore=currentCell?clone(currentCell):null;
 const recent=!!(currentCell&&currentCell.until>now());
 let e=recent?getEvent(currentCell.eventId):null;
 let before=e?snapshotEvent(e):null;
 let feedback='';
 if(isShot(type)){
  if(e&&(e.state==='made'||e.state==='miss')){
   if(e.state==='made'){reviseEvent(e,{state:'miss'});feedback='+MISS';}
   else{reviseEvent(e,{state:'void'});feedback='−MISS';}
  }else{
   e=addEvent(playerSide(playerId),playerId,type,'made',null);
   before=null;feedback='+'+TYPE_META[type].points;
  }
 }else{
  if(e&&(e.state==='valid'||e.state==='void')){
   if(e.state==='valid'){reviseEvent(e,{state:'void'});feedback='−1';}
   else{reviseEvent(e,{state:'valid'});feedback='+1';}
  }else{
   e=addEvent(playerSide(playerId),playerId,type,'valid',null);
   before=null;feedback='+1';
  }
 }
 state.cells[key]={eventId:e.id,lastAt:now(),until:now()+HOLD_MS};
 addUndo(e.id,before,key,cellBefore);
 writeFeedback(key,feedback);
 commitRender();
}
function eventCellKey(eventId){
 const found=Object.keys(state.cells).find(function(key){return state.cells[key]&&state.cells[key].eventId===eventId;});
 return found||null;
}
function refreshEventCell(eventId){
 const key=eventCellKey(eventId);if(!key)return null;
 const old=clone(state.cells[key]);state.cells[key]={eventId:eventId,lastAt:now(),until:now()+HOLD_MS};return {key:key,before:old};
}
function undoLast(){
 const op=state.undoStack.pop();
 if(!op){setToast('没有可撤销的操作');return;}
 if(op.kind==='period'){
  state.period=op.beforePeriod;
  commitRender('已撤销节次切换');
  return;
 }
 const e=getEvent(op.eventId);
 if(e){
  if(op.before){
   const oldRevisions=(e.revisions||[]).slice();
   const restored=clone(op.before);
   Object.keys(e).forEach(function(k){delete e[k];});
   Object.assign(e,restored);
   e.revisions=(restored.revisions||[]).concat(oldRevisions.length? [{at:now(),snapshot:oldRevisions[oldRevisions.length-1].snapshot,action:'撤销'}]:[]);
   e.updatedAt=now();
  }else reviseEvent(e,{state:'void'});
 }
 if(op.cell){
  if(op.cellBefore)state.cells[op.cell]=clone(op.cellBefore);
  else delete state.cells[op.cell];
 }
 if(op.cellsBefore){
  Object.keys(state.cells).forEach(function(key){if(state.cells[key]&&state.cells[key].eventId===op.eventId)delete state.cells[key];});
  Object.keys(op.cellsBefore).forEach(function(key){state.cells[key]=clone(op.cellsBefore[key]);});
 }
 if(op.feedbackBefore){
  Object.keys(op.feedbackBefore).forEach(function(key){
   if(op.feedbackBefore[key])state.feedback[key]=clone(op.feedbackBefore[key]);
   else delete state.feedback[key];
  });
 }
 commitRender('已撤销最近一次操作');
}

function eventCellDestination(e){

 const candidates=[];
 for(let slot=0;slot<group.slots;slot++){
  const key=cellKey(e.playerId,e.type,slot);const cell=state.cells[key];
  if(!cell||cell.eventId===e.id||cell.until<=now())return key;
  candidates.push({key:key,lastAt:cell.lastAt||0});
 }
 candidates.sort(function(a,b){return a.lastAt-b.lastAt;});
 return candidates.length?candidates[0].key:null;
}
function updateEventFromForm(form){

 const period=Math.max(1,Math.min(20,parseInt(fd.get('period'),10)||1));
 const type=e.type==='substitution'?'substitution':String(fd.get('type')||e.type);
 let newState=String(fd.get('state')||e.state);
 if(isShot(type)){if(['made','miss','void'].indexOf(newState)<0)newState='made';}
 else if(['valid','void'].indexOf(newState)<0)newState='valid';
 const playerId=e.type==='substitution'?e.playerId:String(fd.get('playerId')||e.playerId||'');
 reviseEvent(e,{period:period,type:type,playerId:playerId,state:newState});
 Object.keys(state.cells).forEach(function(key){if(state.cells[key]&&state.cells[key].eventId===e.id)delete state.cells[key];});
 const destination=eventCellDestination(e);
 if(destination){
  if(!Object.prototype.hasOwnProperty.call(cellsBefore,destination)&&state.cells[destination])cellsBefore[destination]=clone(state.cells[destination]);
  if(!Object.prototype.hasOwnProperty.call(feedbackBefore,destination))feedbackBefore[destination]=state.feedback[destination]?clone(state.feedback[destination]):null;
  state.cells[destination]={eventId:e.id,lastAt:now(),until:now()+HOLD_MS};
  writeFeedback(destination,'已更正');
 }
 addUndo(e.id,before,null,null,{cellsBefore:cellsBefore,feedbackBefore:feedbackBefore});

 commitRender('事件已更正，累计数据已重新计算');
}

 const root='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
 const book='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="球员统计" sheetId="1" r:id="rId1"/><sheet name="全部事件" sheetId="2" r:id="rId2"/><sheet name="比赛信息" sheetId="3" r:id="rId3"/></sheets></workbook>';
 const rel='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet3.xml"/><Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
 const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF233C57"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>';
 const zip=postZipFiles([['[Content_Types].xml',types],['_rels/.rels',root],['xl/workbook.xml',book],['xl/_rels/workbook.xml.rels',rel],['xl/styles.xml',styles],['xl/worksheets/sheet1.xml',postSheetXml(stats,[6,9,12,15])],['xl/worksheets/sheet2.xml',postSheetXml(events,[])],['xl/worksheets/sheet3.xml',postSheetXml(meta,[])]]);
 const url=URL.createObjectURL(zip),a=document.createElement('a');a.href=url;a.download=postFileStem(m)+'-比赛统计.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function postRenderArchiveList(){const archives=postLoadArchives();return '<div class="post-game"><div class="post-max"><div class="post-top"><span class="post-brand">COURTFLOW PRO / MATCH ARCHIVE</span><button type="button" class="post-action" data-action="post-back-setup">返回赛前准备</button></div><div class="post-headrow"><div><h2>历史比赛</h2><p>只在当前浏览器本地保存，建议同时导出完整 JSON 备份。</p></div></div><div class="post-archives">'+(archives.length?archives.slice().reverse().map(a=>'<div class="post-archive-row"><div><strong>'+escapeHtml(a.match.teams.home.name)+' '+postTeamScore(a.match,'home')+' : '+postTeamScore(a.match,'away')+' '+escapeHtml(a.match.teams.away.name)+'</strong><div class="meta">'+escapeHtml(formatTime(a.match.finishedAt||a.archivedAt))+' · '+(a.match.events||[]).length+'条事件</div></div><div class="buttons"><button class="post-action" data-action="post-view-archive" data-id="'+escapeAttr(a.id)+'">查看报表</button><button class="post-action" data-action="post-archive-json" data-id="'+escapeAttr(a.id)+'">JSON备份</button></div></div>').join(''):'<div class="empty">暂无已归档比赛。结束比赛后点击「开启新比赛」即可自动归档。</div>')+'</div></div></div>';}
function postRenderNewMatchConfirm(){return '<div class="overlay" data-modal-backdrop><section class="modal result-dialog" role="dialog" aria-modal="true" aria-label="开始新比赛确认"><header class="modal-head"><h2>开始一场新比赛？</h2></header><div class="modal-body"><div class="result-notice">将当前已经完赛的比赛保存到本机「历史比赛」，随后创建全新的比赛记录，并返回赛前设置。新比赛不会继承原比分和球员统计。</div><div class="post-warning">本地历史比赛仅保存在当前浏览器。建议先下载「完整 JSON 备份」，以防清除浏览器数据后无法恢复。</div></div><footer class="modal-foot result-actions"><button class="action-btn" data-action="close-modal">取消</button><button class="action-btn primary" data-action="post-confirm-new">保存历史并开启新比赛</button></footer></section></div>';}
const postBaseRenderModal=renderModal;
renderModal=function(){if(ui.modal&&ui.modal.kind==='post-new-confirm')return postRenderNewMatchConfirm();return postBaseRenderModal();};
const postBaseRenderSetup=renderSetup;
renderSetup=function(){let html=postBaseRenderSetup();return html.replace('<div class="setup-submit">','<div class="setup-submit"><button type="button" class="action-btn" data-action="post-show-archives">历史比赛 ('+postLoadArchives().length+')</button>');};
const postBaseRender=render;
render=function(){
 const archive=ui.archiveViewId?postGetArchive(ui.archiveViewId):null;
 const activePost=!!(state.started&&state.finishedAt),postView=!!archive||activePost||!!ui.showArchives;
 document.body.classList.toggle('post-view',postView);
 if(ui.showArchives){app.innerHTML=postRenderArchiveList();return;}
 if(archive||activePost){app.innerHTML=postResultPage(archive?archive.match:state,!!archive)+(ui.modal?renderModal():'')+currentToast();return;}
 postBaseRender();
};
const postBaseOnClick=onClick;
onClick=function(ev){const b=ev.target.closest('[data-action]');if(b){const act=b.dataset.action;
 if(act==='confirm-finish'&&!state.finishedAt){state.finishedAt=now();state.feedback={};state.cells={};ui.foulMenu=null;ui.modal=null;save();render();app.querySelector('.post-game')?.scrollTo(0,0);return;}
 if(act==='post-export-xlsx'||act==='post-export-csv'||act==='post-export-events'||act==='post-export-json'||act==='post-print'){const m=postResultMatch();if(!m)return;try{if(act==='post-export-xlsx')postExportXlsx(m);if(act==='post-export-csv')postExportCsv(m);if(act==='post-export-events')postExportEvents(m);if(act==='post-export-json')postExportJson(m);if(act==='post-print')window.print();}catch(ex){console.error(ex);setToast('文件导出失败，请尝试 CSV 或 JSON');}return;}
 if(act==='ask-new-match'&&state.finishedAt){ui.modal={kind:'post-new-confirm'};render();return;}
 if(act==='post-confirm-new'&&state.finishedAt){const existing=postLoadArchives(),snapshot=clone(state);if(!existing.some(a=>a.id===snapshot.gameId))existing.push({id:snapshot.gameId,archivedAt:now(),match:snapshot});try{localStorage.setItem(POST_ARCHIVE_KEY,JSON.stringify(existing));}catch(ex){setToast('无法保存历史比赛：存储空间不足，请先下载 JSON 备份');return;}
  const previous=state;state=freshState();state.finishedAt=null;setupDraft=setupDraftFromState();ui.modal=null;ui.showArchives=false;ui.archiveViewId=null;ui.drawerOpen=false;if(!save()){state=previous;setToast('无法创建新比赛：本地存储写入失败');return;}render();return;}
 if(act==='post-show-archives'){ui.showArchives=true;ui.modal=null;render();return;}
 if(act==='post-back-setup'){ui.showArchives=false;ui.archiveViewId=null;render();return;}
 if(act==='post-view-archive'){ui.showArchives=false;ui.archiveViewId=b.dataset.id;render();return;}
 if(act==='post-back-archive'){ui.archiveViewId=null;ui.showArchives=true;render();return;}
 if(act==='post-archive-json'){const a=postGetArchive(b.dataset.id);if(a)postExportJson(a.match);return;}
 }
 postBaseOnClick(ev);
};

app.addEventListener('click',onClick);
app.addEventListener('submit',onSubmit);
app.addEventListener('change',handleImportChange);
window.addEventListener('resize',function(){});
if(!loaded.error&&!localStorage.getItem(STORAGE_KEY))save();
render();
})();
</script>
