/* v0.1.1 FIBA pen-period and blank-grid fixes */
.player-table-wrap{position:relative;height:64.5mm;flex:0 0 64.5mm;overflow:hidden}
.player-table-wrap .player-table{height:64.5mm}
.roster-unused-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
.player-table td.foul-slot{position:relative}
.foul-halftime-stroke{position:absolute;left:0;top:0;bottom:0;width:2px;background:#1b2a38}
.foul-unused-stroke{position:absolute;left:0;right:0;top:50%;height:1.6px;background:#263746}
.running-final-cancel{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}


/* v0.2: dual-column scorekeeping / always-visible responsive FIBA form */
.wrap{max-width:1760px}
.lite-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(410px,0.94fr);gap:16px;align-items:start}
.live-workspace,.sheet-pane{min-width:0}
.live-workspace>.paper,.live-workspace>.rosters-live,.live-workspace>.sub-stage{margin-bottom:13px}
.live-workspace>.rosters-live>.paper{margin:0}
.rosters-live{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sub-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px}
.sub-toolbar>div{display:flex;flex-direction:column;gap:3px}
.sub-toolbar strong{font-size:15px}
.sub-toolbar .btn{min-width:102px}
.court-team{padding:13px;min-width:0}
.team-title{align-items:center;margin-bottom:9px}
.team-name-line{display:flex;align-items:center;gap:7px;min-width:0}
.team-name-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-chip,.team-dot{width:12px;height:12px;display:inline-block;border:1px solid #b1bec9;border-radius:4px;flex:0 0 auto}
.court-roster{display:flex;flex-direction:column;gap:6px}
.court-roster-note{font-size:10px;color:#8796a7;margin-top:8px}
.court-team .player-item{display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:1fr 1fr;column-gap:8px;row-gap:0;min-height:54px;padding:6px 8px;background:#f2f7ff}
.court-team .jersey{grid-row:span 2;border-radius:8px;padding:9px 2px;text-align:center;font-size:13px;font-weight:900}
.court-team .nm{font-weight:740;font-size:11.5px}
.court-team .scorefoul{display:flex;gap:10px;align-items:center;font-size:10px;color:#667b92;white-space:nowrap}
.court-team .scorefoul .warn{color:#c23640;font-weight:850}
.sheet-pane{position:sticky;top:10px;padding:14px}
.sheet-pane-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-pane-head .h2{margin:0 0 4px}
.sheet-zoom{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:10px 0 2px}
.sheet-mount{min-width:0}
.sheet-scroll{margin-top:9px;max-width:100%;overflow:auto;max-height:calc(100vh - 185px);padding:10px;background:#edf3f7;overscroll-behavior:contain}
.sheet-scale-frame{margin:0 auto;position:relative}
.sheet-scale-frame>.sheet-paper{position:absolute;top:0;left:0;max-width:none!important;margin:0!important}
.sheet-footnote{margin-bottom:0}
.sub-stage{padding:14px}
.sub-stage-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.subs-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.sub-column{background:#f6f9fc;border:1px solid #e2e9f2;border-radius:12px;padding:7px;min-width:0}
.sub-column.bench-side{background:#fbfcfe}
.sub-col-title{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-height:27px;margin-bottom:7px;font-size:11px}
.sub-col-title small{color:#7a8c9c;font-size:9px}
.sub-col-list{display:flex;flex-direction:column;gap:6px}
.sub-player{width:100%;min-width:0;min-height:55px;border:1px solid #d9e4ef;background:white;border-radius:9px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#334961}
.sub-player.sub-chosen{outline:2px solid #3276cf;border-color:#3276cf;background:#ecf5ff}
.sub-player.sub-used{opacity:.55;background:#e4edf4}
.sub-no{min-width:34px;padding:4px 3px;border-radius:6px;text-align:center;font-weight:900;font-size:12px}
.sub-name{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%}
.sub-player small{font-size:9px;color:#2867b5}
.sub-pair-list{display:flex;gap:7px;flex-wrap:wrap;min-height:30px;margin:12px 0 6px;align-items:center}
.sub-pair{background:#e9f2ff;color:#2b5e9d;padding:6px 8px;border-radius:9px;font-weight:700;font-size:11px}
.sub-pair button{border:0;background:transparent;color:#b13944;font-size:16px;font-weight:900;cursor:pointer}
.sub-actions{display:flex;justify-content:flex-end;gap:8px}

</style></head><body><div id="app"></div><div id="modal" class="modal-backdrop" hidden></div><div id="printRoot" class="print-only"></div><script>(()=>{'use strict';

 }).join('')} ${oncourt.length<5?`<div class="notice warn">场上目前只有 ${oncourt.length} 人，请核对裁判判罚</div>`:''}</div><div class="court-roster-note">场上 ${oncourt.length} 人 · 替补 ${data.teams[t].players.length-oncourt.length} 人</div></section>`;

function eventsView(m){const rows=data.events.slice().reverse().filter(e=>!['periodStart'].includes(e.kind)).slice(0,allHistory?Infinity:12);return `<section class="paper"><div class="toolfoot" style="justify-content:space-between"><h2 class="h2">最近登记</h2><button class="btn tiny" data-act="historyToggle">${allHistory?'收起流水':'显示全部'}</button><button class="btn tiny red" data-act="undo" ${!data.events.length?'disabled':''}>↶ 撤销最后一笔</button></div><div style="overflow:auto"><table class="logtable"><thead><tr><th>节 / 时间</th><th>球队</th><th>内容</th><th>操作</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${e.period}节 · ${fmt(e.time)}</td><td>${E(e.kind==='subBatch'?(new Set(e.pairs.map(x=>x.team)).size>1?'双方':short(e.pairs[0].team)):short(e.team||'A'))}</td><td>${E(eventLabel(e))}</td><td><div class="minirow"><button class="btn tiny" data-act="editEvent" data-id="${e.id}" ${!['score','foul','coachFoul','timeout'].includes(e.kind)?'disabled':''}>编辑</button><button class="btn tiny" data-act="deleteEvent" data-id="${e.id}" ${e.kind==='periodEnd'?'disabled':''}>删除</button></div></td></tr>`).join('')||`<tr><td colspan="4">暂无事件。点击队员号码开始。</td></tr>`}</tbody></table></div></section>`}

function mountPreview(top=0,left=0){
 const mount=$('#previewMount');if(!mount)return;

 mount.innerHTML=`<div class="sheet-scroll" id="previewViewport"><div class="sheet-scale-frame" id="sheetScaleFrame"></div></div>`;

function fitSheet(){
 const viewport=$('#previewViewport'),frame=$('#sheetScaleFrame'),paper=frame?.querySelector('.sheet-paper');if(!paper||!viewport)return;
 const usable=Math.max(1,viewport.clientWidth-2),fullWidth=paper.offsetWidth,fullHeight=paper.offsetHeight;

 frame.style.height=`${Math.ceil(fullHeight*scale)}px`;
 paper.style.transformOrigin='top left';paper.style.transform=`scale(${scale})`;

}

 const ff=res[pl.id]?.fouls||[];let marks=ff.map(x=>foulMark(x));if(res[pl.id]?.disqualified&&marks.length<5)marks.push('GD');const halfClose=data.events.some(e=>e.kind==='periodEnd'&&e.period===2), gameClose=!!data.meta.endTime&&data.events.some(e=>e.kind==='periodEnd'&&e.period===data.period);

 return `<tr class="entry"><td>${E(pl.license||'')}</td><td class="name">${E(pl.name||'')} ${pl.captain?'(CAP)':''}</td><td>${E(pl.number)}</td><td>${pl.starter?'<span class="foul-circle">x</span>':p.entered[t].has(pl.id)?'x':''}</td>${Array.from({length:5},(_,j)=>{let closure='';if(gameClose&&j>=marks.length)closure='<span class="foul-unused-stroke"></span>';else if(halfClose&&j===foulsBeforeHalf&&j>=marks.length)closure='<span class="foul-halftime-stroke"></span>';return `<td class="foul-slot" style="color:${quarterFoulColor(ff,j)}">${marks[j]||''}${closure}</td>`}).join('')}</tr>`}).join('');
 return `<section class="sheet-team"><div class="sheet-team-header"><div class="sheet-team-headline"><span>Team ${t} · ${E(team.name)}</span><span>Time-outs / Team fouls</span></div><div class="sheet-meta-tiny"><div class="sheet-tt"><div><b>H1</b>${slots('H1',2)}</div><div><b>H2</b>${slots('H2',3)}</div><div><b>OT</b>${slots('OT',3)}</div></div><div class="sheet-ff"><div><b>Q1</b>${foulQ(1)}</div><div><b>Q2</b>${foulQ(2)}</div><div><b>Q3</b>${foulQ(3)}</div><div><b>Q4</b>${foulQ(4)}</div></div></div></div><div class="player-table-wrap"><table class="player-table"><colgroup><col style="width:8%"><col style="width:55%"><col style="width:6%"><col style="width:7%">${Array.from({length:5},()=>'<col style="width:4.8%">').join('')}</colgroup><thead><tr><th>Lic.</th><th>Players</th><th>No.</th><th>In</th><th colspan="5">Fouls 1 · 2 · 3 · 4 · 5</th></tr></thead><tbody>${playerRows}</tbody></table>${pls.length<12?`<svg class="roster-unused-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="未登记球员行封格"><path d="M 0 ${6.3/64.5*100 + pls.length*4.6/64.5*100 + (4.6/64.5*100)/2} H 76" stroke="#273744" stroke-width="0.45" vector-effect="non-scaling-stroke" fill="none"/>${pls.length<11?`<path d="M 76 ${6.3/64.5*100 + pls.length*4.6/64.5*100 + (4.6/64.5*100)/2} L 100 100" stroke="#273744" stroke-width="0.65" vector-effect="non-scaling-stroke" fill="none"/>`:''}</svg>`:''}</div><div class="sheet-coaches"><div><b>Head coach</b> ${E(team.coach)} ${coach.map(e=>`<span style="color:${fibaInk(e.period)}">${foulMark(e)}</span>`).join(' ')}</div><div><b>1st assistant</b> ${E(team.assistantCoach)}</div></div></section>`}
function fibaInk(q){return Number(q)<=4&&Number(q)%2===1?'#c52f3b':'#202c38'}
function quarterFoulColor(es,j){if(!es[j])return '#233345';return [1,3].includes(es[j].period)?'#c9424e':'#202c38'}
function running(p){
 const marks={A:{},B:{}},ends={A:{},B:{}},totals={A:0,B:0};
 const periodEvents=data.events.filter(e=>e.kind==='periodEnd');
 const final=!!data.meta.endTime&&periodEvents.length>0&&data.events.at(-1)?.kind==='periodEnd'&&data.events.at(-1)?.period===data.period;
 for(const e of data.events){
  if(e.kind==='score'){
   const t=e.team;totals[t]+=e.points;
   marks[t][totals[t]]={player:playerOf(t,e.playerId)?.number||'?',type:e.points,period:e.period};
  }
  if(e.kind==='periodEnd')for(const t of ['A','B'])if(totals[t]>0)ends[t][totals[t]]={period:e.period,final:final&&e.period===data.period};
 }
 let html='<div class="running-blocks">';
 for(let g=0;g<4;g++){
  html+='<div class="score-block">';
  for(let i=1;i<=40;i++){
   const n=g*40+i;
   for(let k=0;k<4;k++){
    const t=k<2?'A':'B',isnum=k===1||k===2,m=marks[t][n],end=ends[t][n];
    const col=fibaInk(m?.period||end?.period||2),boundaryColor=fibaInk(end?.period||2);
    let inner=isnum?String(n):'';
    if(m){
     if(isnum){
      if(m.type===1)inner+=`<span class="ft-mark" style="color:${col}">●</span>`;
      else inner+=`<svg class="goal-line" viewBox="0 0 20 20" preserveAspectRatio="none" aria-label="投篮命中"><line x1="1" y1="19" x2="19" y2="1" stroke="currentColor" stroke-width="2.1"/></svg>`.replace('class="goal-line"',`class="goal-line" style="color:${col}"`);
     }else inner=`<span class="scorer ${m.type===3?'three':''}" style="color:${col}">${E(m.player)}</span>`;
    }
    if(end){
     if(isnum)inner+=`<span class="quarter-ring" style="color:${boundaryColor}"></span>`;
     inner+=`<span class="end-line ${end.final?'final':''}" style="color:${boundaryColor}"></span>`;
    }
    html+=`<span class="score-cell ${isnum?'num':''}">${inner}</span>`;
   }
  }
  // Final cancellation slash is confined to the unused part of the current 40-point block.
  if(final){
   const lines=[];
   for(const t of ['A','B']){
    const last=totals[t];if(last<1||last>160||Math.floor((last-1)/40)!==g||last%40===0)continue;
    const row=last%40;
    const a=t==='A'?38:62,b=t==='A'?49:51;
    lines.push(`<path d="M ${a} ${row*2.5+0.35} L ${b} 100" stroke="${fibaInk(data.period)}" stroke-width="1.2" fill="none" vector-effect="non-scaling-stroke"/>`);
   }
   if(lines.length)html+=`<svg class="running-final-cancel" viewBox="0 0 100 100" preserveAspectRatio="none">${lines.join('')}</svg>`;
  }
  html+='</div>';
 }
 return html+'</div>';
}
function sheetBody(p){const qstats=Array.from({length:4},(_,i)=>p.qscore[i+1]||{A:0,B:0});let overtime=p.qscore[5]?Object.entries(p.qscore).filter(([q])=>Number(q)>4).reduce((a,[q,v])=>({A:a.A+v.A,B:a.B+v.B}),{A:0,B:0}):{A:0,B:0};const winner=p.scores.A===p.scores.B?'未决':p.scores.A>p.scores.B?teamName('A'):teamName('B');return `<div class="sheet-paper"><div class="sheet-title"><small>FIBA 2026 APPENDIX B · ELECTRONIC FORM STUDY</small><strong>BASKETBALL SCORESHEET</strong></div><div class="sheet-topnames"><span>Team A: ${E(teamName('A'))}</span><span>Team B: ${E(teamName('B'))}</span></div><div class="sheet-meta"><div><div class="clip">Competition: ${E(data.meta.competition)} &nbsp; Date: ${E(data.meta.date)} &nbsp; Time: ${E(data.meta.time)}</div><div class="clip">Game No.: ${E(data.meta.gameNo)} &nbsp; Place: ${E(data.meta.place)}</div></div><div><div class="clip">Crew chief: ${E(data.meta.crewChief)}</div><div class="clip">Umpire 1: ${E(data.meta.umpire1)} &nbsp; Umpire 2: ${E(data.meta.umpire2)}</div></div></div><div class="sheet-main"><div class="sheet-left">${sheetTeam('A',p)}${sheetTeam('B',p)}</div><div class="sheet-running"><div class="sheet-running-title">RUNNING SCORE</div><div class="running-head">${Array.from({length:4},()=>'<div class="rh"><span>A</span><span>B</span></div>').join('')}</div>${running(p)}</div></div><div class="sheet-footer"><div class="sheet-footer-left"><div class="sheet-footer-row"><strong>Scorer</strong><span>${E(data.meta.scorer)}</span></div><div class="sheet-footer-row"><strong>Assistant scorer</strong><span>${E(data.meta.assistantScorer)}</span></div><div class="sheet-footer-row"><strong>Timer</strong><span>${E(data.meta.timer)}</span></div><div class="sheet-footer-row"><strong>Shot clock operator</strong><span>${E(data.meta.shotClockOperator)}</span></div><div class="sheet-footer-row"><strong>Crew chief / Umpires</strong><span>Signatures: __________________</span></div><div class="sheet-footer-row"><span>Captain's signature in case of protest</span><span>______________</span></div></div><div class="sheet-footer-right"><strong>Scores by period</strong>${qstats.map((v,i)=>`<div class="sheet-footer-row"><span>Quarter ${i+1}</span><span style="color:${fibaInk(i+1)}">A ${v.A} &nbsp; B ${v.B}</span></div>`).join('')}<div class="sheet-footer-row"><span>Overtimes</span><span style="color:${fibaInk(5)}">A ${overtime.A} &nbsp; B ${overtime.B}</span></div><div class="finalscore">FINAL SCORE &nbsp; A ${p.scores.A} &nbsp; : &nbsp; ${p.scores.B} B</div><div class="sheet-footer-row"><span>Winning team: ${E(winner)}</span><span>Ended: ${E(data.meta.endTime||'____:____')}</span></div></div></div><div class="sheet-note">CourtFlow Lite v0.2 · experimental printable form based on FIBA OBR 2026 Appendix B · unsigned / unofficial until verified</div></div>`}
function preview(){const p=project();if(p.scores.A>160||p.scores.B>160){notify('超过160分，当前单页逐分栏无法容纳，请先备份并等待扩展版');return}printCache=sheetBody(p);render()}
function printPDF(){const p=project();if(p.scores.A>160||p.scores.B>160){notify('至少一队超过160分，当前模板不支持无损导出。请先导出JSON备份。');return}if(data.period>7){notify('已超过三个加时，当前官方式样无法在单页完整显示暂停，请先保留JSON备份');return}$('#printRoot').innerHTML=sheetBody(p);requestAnimationFrame(()=>{window.print()})}
function finishGame(){pauseClock();if(data.events.some(e=>e.kind==='periodEnd'&&e.period===data.period)){close();notify('本节已经结算，不会重复登记');return}if(!data.meta.endTime){const now=new Date();data.meta.endTime=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}record('periodEnd',{});close();notify('已标记本节结束；记录表可打印，签字由现场负责人完成')}
function handleAction(a,b){
 if(subMode){
  if(a==='subMode'||a==='subCancel'){subMode=false;subPairs=[];subPick=null;render();return}
  if(a==='subPick'){subPickAction(b.dataset.t,b.dataset.role,b.dataset.id);return}
  if(a==='subUnpair'){subPairs.splice(Number(b.dataset.i),1);render();return}
  if(a==='subBatchCommit'){subBatchCommit();return}
  notify('请先确认或取消当前换人流程');return;
 }
 if(a==='subMode'){subMode=true;subPairs=[];subPick=null;render();return}
 if(a==='sheetZoom'){previewZoom=b.dataset.v;fitSheet();$$('[data-act="sheetZoom"]').forEach(x=>x.classList.toggle('blue',x.dataset.v===previewZoom));return}
 if(a==='cancel'){close();return}if(a==='setup'){pauseClock();data.stage='setup';save();render();return}if(a==='live'){data.stage='live';save();render();return}if(a==='start'){const error=validate();if(error){notify(error);return}data.stage='live';save();render();return}if(a==='demo'){confirmDlg('加载测试比赛','载入用于检查FIBA PDF绘制的模拟数据。将覆盖当前比赛，请先备份。','demoCommit');return}if(a==='demoCommit'){close();demo();return}if(a==='reset'){resetConfirm();return}if(a==='resetCommit'){close();data=initial();save();printCache=null;render();return}if(a==='addPlayer'){const t=b.dataset.t;let team=data.teams[t];if(team.players.length<12){team.players.push({id:eid(),number:String(team.players.length+1).padStart(2,'0'),name:'',license:'',captain:false,starter:false});save();render()}return}if(a==='removePlayer'){let team=data.teams[b.dataset.t];if(!data.events.length&&team.players.length>5){team.players=team.players.filter(p=>p.id!==b.dataset.id);save();render()}return}if(a==='color'){data.teams[b.dataset.t].kit=b.dataset.v;save();render();return}if(a==='clock'){data.clockRunning?pauseClock():beginClock();return}if(a==='adjustClock'){editClockModal();return}if(a==='clockCommit'){const m=Number($('#setMin').value),s=Number($('#setSec').value);if(!Number.isInteger(m)||!Number.isInteger(s)||m<0||m>99||s<0||s>=60){notify('请输入正确分钟和秒数');return}data.remaining=m*60+s;close();save();render();return}if(a==='nextPeriod'){nextModal();return}if(a==='nextCommit'){let old=data.period;record('periodEnd',{});data.period=old+1;data.remaining=periodLen(data.period);data.duration=data.remaining;data.clockRunning=false;clockRef=null;close();save();render();return}if(a==='endGame'){finishGame();return}if(a==='player'){playerModal(b.dataset.t,b.dataset.id);return}if(a==='pointPick'){pointPick(Number(b.dataset.points));return}if(a==='pointBack'){scoreDraft=null;$('#pointConfirm').hidden=true;return}if(a==='pointCommit'){if(!selected||![1,2,3].includes(scoreDraft))return;const {team,id}=selected,points=scoreDraft;close();record('score',{team,playerId:id,points});return}if(a==='foulPick'){foulPick(false);return}if(a==='coach'){coachModal(b.dataset.t);return}if(a==='coachPick'){foulPick(true);return}if(a==='foulCommit'){if(!selected||!foulDraft)return;const {team,id}=selected,f={team,foulType:foulDraft.type,fts:foulDraft.fts,cancelled:foulDraft.cancelled};if(b.dataset.kind==='foul')f.playerId=id;const kind=b.dataset.kind;close();record(kind,f);const m=project();if(kind==='foul'&&m.players[id]?.fouls.length>=5)notify('球员达到5次犯规，请依裁判指示换人');return}if(a==='sub'){subModal(b.dataset.t);return}if(a==='subCommit'){const team=selected?.team,outId=$('#subOut')?.value,inId=$('#subIn')?.value;if(!team||!outId||!inId||outId===inId)return;close();record('sub',{team,outId,inId});return}if(a==='timeout'){timeoutModal(b.dataset.t);return}if(a==='timeoutCommit'){let t=b.dataset.t;close();record('timeout',{team:t});return}if(a==='historyToggle'){allHistory=!allHistory;render();return}if(a==='editEvent'){editEventModal(b.dataset.id);return}if(a==='editCommit'){editCommit(b.dataset.id);return}if(a==='undo'){undoModal();return}if(a==='undoCommit'){const last=data.events.pop();if(last?.kind==='periodEnd'&&data.period>last.period){data.period=last.period;data.remaining=0;data.duration=periodLen(data.period)}printCache=null;close();save();render();return}if(a==='deleteEvent'){deleteModal(b.dataset.id);return}if(a==='deleteCommit'){data.events=data.events.filter(x=>x.id!==b.dataset.id);close();printCache=null;save();render();return}if(a==='preview'){preview();return}if(a==='hidePreview'){printCache=null;render();return}if(a==='print'){printPDF();return}if(a==='downloadJSON'){downloadJSON();return}if(a==='importJSON'){$('#importFile').click();return}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();handleAction(b.dataset.act,b)}});
document.addEventListener('input',e=>{const inp=e.target;if(inp.matches('[data-meta]')){const k=inp.dataset.meta;if(k.includes('.')){let [t,prop]=k.split('.');data.teams[t][prop]=inp.value}else data.meta[k]=inp.value;save()}if(inp.matches('[data-player]')&&inp.type==='text'){let p=playerOf(inp.dataset.t,inp.dataset.player);if(p){p[inp.dataset.field]=inp.value;save()}}});
document.addEventListener('change',e=>{const inp=e.target;if(inp.matches('[data-player]')&&inp.type==='checkbox'){const p=playerOf(inp.dataset.t,inp.dataset.player);if(p){if(inp.dataset.field==='captain'&&inp.checked){for(let other of data.teams[inp.dataset.t].players)other.captain=false}p[inp.dataset.field]=inp.checked;save();render()}}if(inp.id==='importFile'&&inp.files?.[0]){const f=inp.files[0];f.text().then(raw=>{try{let d=JSON.parse(raw);if(d?.version!==1||!d?.teams?.A||!Array.isArray(d.events))throw Error('无效版本');data=d;data.clockRunning=false;printCache=null;save();render();notify('备份导入成功')}catch(e){notify('无法导入：文件版本或内容不正确')}})}});
window.addEventListener('beforeprint',()=>{if(data.stage==='live'&&!$('#printRoot').innerHTML)$('#printRoot').innerHTML=sheetBody(project())});

if(location.search.includes('demo=1')){demo();if(location.search.includes('print=1')){$('#app').style.display='none';$('#printRoot').innerHTML=sheetBody(project());}}
else render();
})();
