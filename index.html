<body><div class="wrap" id="app"></div><div id="overlay" class="backdrop hidden"><div class="modal" id="dialog" role="dialog" aria-modal="true"></div></div><div id="emergency" class="critical"><button class="btn" data-act="interrupt" title="任何界面下均可触发的裁判紧急中断">⚑ 突发中断</button></div>
<script>
'use strict';
const STORE='courtflow-v03-demo';const TEAM={A:{name:'主队 / A',short:'A队',color:'blue'},B:{name:'客队 / B',short:'B队',color:'orange'}};
const BASE={A:[1,2,3,4,5,11,12,13,14,15,16,17],B:[6,7,8,9,10,18,19,20,21,22,23,24]};
const DEFAULT_CONFIG={periods:4,periodMinutes:10,otMinutes:5};
const KIT_COLORS=[{key:'red',name:'赤',hex:'#d94a57',bg:'#fff0f1',ink:'#973240',light:false},{key:'orange',name:'橙',hex:'#ee9232',bg:'#fff4e5',ink:'#9b5a19',light:false},{key:'yellow',name:'黄',hex:'#f2cc40',bg:'#fffbea',ink:'#8c6a12',light:true},{key:'green',name:'绿',hex:'#32a66d',bg:'#eaf8f0',ink:'#186545',light:false},{key:'cyan',name:'青',hex:'#28acbe',bg:'#e8f9fb',ink:'#126a77',light:false},{key:'blue',name:'蓝',hex:'#4279d1',bg:'#edf3ff',ink:'#2456a3',light:false},{key:'purple',name:'紫',hex:'#9260c3',bg:'#f5efff',ink:'#68409c',light:false}];
function defaultTeamMeta(){return {A:{name:'主队 / A',color:'blue'},B:{name:'客队 / B',color:'orange'}}}
function defaultPlayerMeta(){const m={};for(const t of ['A','B'])for(const n of BASE[t])m[t+n]={number:String(n),name:''};return m}

const clone=o=>JSON.parse(JSON.stringify(o));const id=()=>Math.random().toString(36).slice(2,10);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=q=>document.querySelector(q);
function newData(){return {version:3,config:clone(DEFAULT_CONFIG),lineups:{A:BASE.A.slice(0,5),B:BASE.B.slice(0,5)},rosters:clone(BASE),teamMeta:defaultTeamMeta(),playerMeta:defaultPlayerMeta(),period:1,clock:600,running:false,openingMode:'jump',events:[],pending:[],nextSeq:1,tab:'events',statTeam:'A',clockUpdated:Date.now(),createdAt:new Date().toISOString()}}
let data;try{const raw=JSON.parse(localStorage.getItem(STORE));data=raw?.version===3?raw:newData()}catch(e){data=newData()}
function hydrateMeta(){if(data.openingMode!=='jump'&&data.openingMode!=='legacy')data.openingMode=(data.events||[]).length?'legacy':'jump';const teams=defaultTeamMeta(),players=defaultPlayerMeta();data.teamMeta={...teams,...(data.teamMeta||{})};data.playerMeta={...players,...(data.playerMeta||{})};for(const t of ['A','B']){data.teamMeta[t]={...teams[t],...(data.teamMeta[t]||{})};for(const n of BASE[t]){let pid=t+n;data.playerMeta[pid]={...players[pid],...(data.playerMeta[pid]||{})};}if(!Array.isArray(data.rosters?.[t]))data.rosters[t]=BASE[t].slice();if(!Array.isArray(data.lineups?.[t]))data.lineups[t]=data.rosters[t].slice(0,5);}}
hydrateMeta();
const teamName=t=>data.teamMeta?.[t]?.name||TEAM[t]?.name||t+'队';
const jersey=pid=>String(data.playerMeta?.[pid]?.number??pid?.slice(1)??'?');
const playerName=pid=>String(data.playerMeta?.[pid]?.name||'').trim();
const playerLabel=(pid,withName=true)=>{if(!pid)return '未知';if(pid.endsWith('?'))return '未知 #??';const name=playerName(pid);return `${pid[0]}#${jersey(pid)}${withName&&name?' '+name:''}`};
const shownIds=value=>String(value??'').replace(/(^|[^\w])([AB])(\d{1,2})(?=$|[^\w])/g,(all,pre,t,num)=>{const pid=t+num;return data.playerMeta?.[pid]?pre+playerLabel(pid):all});
const kit=t=>KIT_COLORS.find(k=>k.key===data.teamMeta?.[t]?.color)||KIT_COLORS.find(k=>k.key===(t==='A'?'blue':'orange'));
const kitVars=t=>{const k=kit(t);return `--jersey:${k.hex};--jersey-text:${k.light?'#463900':'#fff'};--kit-bg:${k.bg};--kit-text:${k.ink};--kit-border:${k.hex};`};
let flow=null,interruptState=null,selectedSub=null,toastHandle=null,tickHandle=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify({...data,running:false,clockUpdated:Date.now()}))}catch(e){/* 页面预览环境可能禁止 localStorage；正式浏览器将正常保存 */}}
function clockFmt(sec){let x=Math.max(0,Math.ceil(Number(sec)||0));return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`}
function emit(type,props={}){const ev={id:id(),seq:data.nextSeq++,period:data.period,clock:Math.max(0,Math.ceil(data.clock)),type,...clone(props)};data.events.push(ev);save();return ev}
const initialState=()=>({lineups:{A:data.lineups.A.slice(),B:data.lineups.B.slice()},phase:data.openingMode==='jump'?'tipoff':'await',holder:null,inbounder:null,lastPass:null,arrow:null,pendingAP:null,openingViolation:false,pendingPossession:null,period:1,stopped:false,source:data.openingMode==='jump'?'第一节开场 · 中圈跳球，点击首次实际控球球员':'旧存档 · 待发球'});
function eventTeam(ev){return ev.team||ev.player?.[0]||null}
function replay(){const st=initialState();const issues=[];const activeLines={A:st.lineups.A,B:st.lineups.B};for(const [index,e] of data.events.entries()){if(e.voided)continue;
 const team=eventTeam(e);const player=e.player||null;const inLine=t=>t&&st.lineups[t[0]]?.includes(Number(t.slice(1)));
 const conflict=msg=>issues.push({eventId:e.id,msg,seq:e.seq});
 if(['pass','steal'].includes(e.type)&&st.holder!==e.from&&st.inbounder!==e.from)conflict('传球/抢断起点与上一持球者不一致');
 if(e.type==='tip_retake'){st.phase='tipoff';st.holder=null;st.inbounder=null;st.lastPass=null;st.openingViolation=false;st.pendingPossession=null;st.source='开场跳球未形成控制 · 重新跳球';}
 if(e.type==='tip_control'){if(st.phase!=='tipoff')conflict('只有开场尚未形成控制权时才能记录首次控球');st.phase='held';st.holder=player;st.inbounder=null;st.lastPass=null;st.openingViolation=false;st.pendingPossession=null;st.arrow=team==='A'?'B':'A';st.source=`开场跳球 · ${player}首次控球，交替球权→${st.arrow}队`;}
 if(e.type==='tip_violation'){if(st.phase!=='tipoff')conflict('开场跳球违例只能发生在首次控球前');st.phase='await';st.holder=null;st.inbounder=null;st.lastPass=null;st.openingViolation=true;st.pendingPossession=e.winner;st.source=`开场跳球违例 · ${e.winner}队待发球`;}
 if(e.type==='inbound'){if(st.openingViolation&&st.arrow===null){if(st.pendingPossession&&st.pendingPossession!==player?.[0])conflict('跳球违例判定的发球队与实际选择的发球队不一致');st.arrow=player?.[0]==='A'?'B':'A';st.openingViolation=false;st.pendingPossession=null;}
  if(st.pendingAP&&st.pendingAP.team!==player?.[0]){conflict('交替拥有发球方与箭头不一致，请核对裁判判罚');st.pendingAP=null;}
  st.phase='inbound';st.holder=null;st.inbounder=player;st.lastPass=null;st.source=`${player}发球`;}
 if(e.type==='ap_flip'){if(st.pendingAP?.team===e.fromTeam&&st.arrow===e.fromTeam){st.arrow=st.arrow==='A'?'B':'A';st.pendingAP=null;}else{conflict('交替拥有箭头翻转缺少相应的未完成交替发球');st.pendingAP=null;}}
 if(e.type==='pass'){st.phase='held';st.holder=e.to;st.inbounder=null;st.lastPass=e.from;st.source=`${e.from} → ${e.to}`;}
 if(e.type==='steal'){st.phase='held';st.holder=e.to;st.inbounder=null;st.lastPass=null;st.source=`${e.from}失误 · ${e.to}抢断`;}
 if(e.type==='shot_made'){if(st.phase==='held'&&player&&st.holder!==player)conflict('投篮者与持球者不一致');if(!e.abnormal&&e.assistCandidate!==(st.lastPass&&st.lastPass[0]===team?st.lastPass:null))conflict('助攻候选与历史传球链不符，需重新核验');st.phase='await';st.holder=null;st.inbounder=null;st.lastPass=null;st.source=`${player||'未知'} ${e.points}分命中 · 待发球`;}
 if(e.type==='unknown_score'){st.phase='await';st.holder=null;st.inbounder=null;st.lastPass=null;st.source=`${e.points}分命中待核实 · 待发球`;}
 if(e.type==='shot_miss'){st.phase='loose';st.holder=null;st.inbounder=null;st.lastPass=null;st.source=`${player}投篮不中 · 待归属`;}
 if(e.type==='shot_fouled'){st.phase='dead';st.holder=null;st.inbounder=null;st.lastPass=null;st.source=`${player}投篮被犯规（不计出手）`;}
 if(e.type==='block'){st.source=`${e.player}盖帽 · 待篮板`;}
 if(e.type==='rebound'){st.phase='held';st.holder=player;st.inbounder=null;st.lastPass=null;st.source=`${player}${e.offensive?'进攻':'防守'}篮板`;}
 if(e.type==='team_rebound'){st.phase='await';st.holder=null;st.inbounder=null;st.lastPass=null;st.source=`${e.team}队球队篮板 · 待发球`;}
 if(['out','turnover','violation'].includes(e.type)&&st.phase==='inbound'&&st.pendingAP){conflict('交替拥有发球途中出现出界或违例，箭头须按裁判判罚核对；已停止自动翻转');st.pendingAP=null;}
 if(['out','turnover','foul','violation','jump','ref_interrupt','timeout','ft_end'].includes(e.type)){st.phase='await';st.holder=null;st.inbounder=null;st.lastPass=null;st.source=e.label||({out:'出界 · 待发球',turnover:'失误 · 待发球',foul:'犯规 · 待恢复',violation:'违例 · 待发球',jump:'争球 · 待发球',ref_interrupt:'裁判中断 · 待恢复',timeout:'暂停 · 待发球',ft_end:'罚球结束 · 待发球'}[e.type]);}
 if(e.type==='ft'){st.phase='dead';st.holder=null;st.inbounder=null;st.lastPass=null;st.source=`${player}罚球${e.attempt}/${e.total} ${e.made?'命中':'未中'}`;}
 if(e.type==='sub'){for(const pair of e.pairs||[]){let a=st.lineups[e.team];if(!a.includes(Number(pair.out)))conflict(`下场球员${pair.out}不在场`);if(a.includes(Number(pair.in)))conflict(`上场球员${pair.in}已在场`);a=a.map(n=>n===Number(pair.out)?Number(pair.in):n);st.lineups[e.team]=a;}st.source=`${e.team}队换人 ${e.pairs?.length||0}组`}
 if(e.type==='remove'){st.lineups[e.team]=st.lineups[e.team].filter(n=>n!==Number(e.number));st.source=`${e.team}${e.number}离场`;}
 if(e.type==='period_start'){st.period=e.period;st.phase='await';st.holder=null;st.inbounder=null;st.lastPass=null;st.pendingAP=st.arrow?{team:st.arrow,source:'period'}:null;st.source=`第${e.period}节 · ${st.arrow?st.arrow+'队交替拥有发球':'待发球'}`}
 if(e.type==='period_end'){st.stopped=true;st.phase='dead';st.holder=null;st.inbounder=null;st.lastPass=null;st.source=`第${e.period}节结束`}
 if(e.type==='ap_setup'){st.arrow=e.team;st.source=`交替球权箭头→${e.team}`}
 if(e.type==='jump'&&e.flipPending){if(st.arrow&&st.arrow===e.winner)st.pendingAP={team:e.winner,source:'jump'};else{conflict('争球结果与交替球权箭头不一致，未自动翻转箭头');st.pendingAP=null;}}
 if(e.type==='resume'){st.phase='held';st.holder=player;st.inbounder=null;st.lastPass=null;st.source=`${player}恢复持球（事件归属待核）`;}
 }
 return {st,issues};}
function stats(team){const base={};for(const n of data.rosters[team])base[team+n]={id:team+n,pts:0,fg2a:0,fg2m:0,fg3a:0,fg3m:0,fta:0,ftm:0,reb:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,tov:0,foul:0};const u={id:team+'?',pts:0,fg2a:0,fg2m:0,fg3a:0,fg3m:0,fta:0,ftm:0,reb:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,tov:0,foul:0};base[u.id]=u;let score=0,teamRebs=0,adjust=0,ftLog=0;for(const e of data.events){if(e.voided)continue;if(e.type==='steal'){if(e.from?.[0]===team&&base[e.from])base[e.from].tov++;if(e.to?.[0]===team&&base[e.to])base[e.to].stl++;continue}if(eventTeam(e)!==team)continue;let p=base[e.player]||u;const incr=(k,n=1)=>p[k]+=n;
 if(e.type==='shot_made'){score+=e.points;p.pts+=e.points;incr(e.points===2?'fg2m':'fg3m');incr(e.points===2?'fg2a':'fg3a')}
 if(e.type==='shot_miss')incr(e.points===2?'fg2a':'fg3a');
 if(e.type==='ft'){incr('fta');if(e.made){incr('ftm');incr('pts');score++}}
 if(e.type==='unknown_team_points'){score+=e.points;u.pts+=e.points;adjust+=e.points}
 if(e.type==='score_adjust'){score+=e.points;u.pts+=e.points;adjust+=e.points}
 if(e.type==='assist')incr('ast');if(e.type==='block')incr('blk');if(e.type==='turnover')incr('tov');if(e.type==='rebound'){incr('reb');incr(e.offensive?'oreb':'dreb');}if(e.type==='team_rebound')teamRebs++;if(e.type==='foul'&&e.player)incr('foul');}
 return {players:base,score,teamRebs,adjust};}
function label(e){return shownIds(rawLabel(e))}
function rawLabel(e){const p=e.player||'';if(e.voided)return '[已作废] '+label({...e,voided:false});switch(e.type){case'tip_control':return `开场跳球 · ${p} 首次控球`;case'tip_retake':return '开场重跳 · 尚无人控制';case'tip_violation':return `开场跳球违例 · ${e.winner}队发球`;case'ap_flip':return `交替球权翻转 · 下次${e.fromTeam==='A'?'B':'A'}队`;case'inbound':return `${p} 发球`;case'pass':return `${e.from} → ${e.to} · 成功传球`;case'steal':return `${e.from} 失误 / ${e.to} 抢断`;case'shot_made':return `${p} ${e.points}分命中`;case'shot_miss':return `${p} ${e.points}分不中`;case'shot_fouled':return `${p} 投篮被犯规 · 不计出手`;case'unknown_score':return `${e.points}分命中 · 归属待处理`;case'assist':return `${p} 助攻`;case'block':return `${p} 盖帽`;case'rebound':return `${p} ${e.offensive?'进攻':'防守'}篮板`;case'team_rebound':return `${e.team}队球队篮板`;case'out':return e.label||'出界';case'turnover':return `${p} 失误`;case'foul':return `${p||e.team+'席位'} ${e.foulType||'犯规'} · ${e.fts||0}罚`;case'ft':return `${p} 罚球 ${e.attempt}/${e.total} ${e.made?'命中':'不中'}`;case'ft_end':return e.label||'罚球组结束';case'ft_void':return e.label||'罚球违例 · 本罚取消';case'sub':return `${e.team}队换人 ${(e.pairs||[]).map(p=>p.out+'→'+p.in).join('，')}`;case'remove':return `${e.team}${e.number}离场`;case'timeout':return `${e.team}队暂停`;case'ref_interrupt':return `突发情况暂停`;case'violation':return e.label||'违例';case'jump':return '争球 · '+e.winner+'队发球';case'period_end':return '第'+e.period+'节结束';case'period_start':return '第'+e.period+'节开始';case'score_adjust':return `${e.team}队未知得分校正 ${e.points>0?'+':''}${e.points}`;case'unknown_team_points':return `${e.team}队未知球员得分 +${e.points}`;case'ap_setup':return '交替球权→'+e.team;case'resume':return `${p}持球（待补录）`;default:return e.label||e.type}}
function pendingAdd(kind,ref,details={}){data.pending.push({id:id(),kind,ref,...details});save()}
function pendingRemove(id){data.pending=data.pending.filter(t=>t.id!==id);save()}
function status(){return replay().st}
function showToast(msg){let n=$('.toast');if(n)n.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.remove(),2600)}
function render(){const st=status(),a=stats('A'),b=stats('B'),issues=replay().issues;const mode=st.phase;const holder=st.holder;const dt=data.events.slice(-1)[0];const hint=flow?flow.title:st.source;
 const playerNodes=(t,start=0,end)=>st.lineups[t].slice(start,end).map(n=>{const pid=t+n;return `<button style="${kitVars(t)}" class="node ${t==='B'?'b':''} ${holder===pid?'current':''} ${st.inbounder===pid?'needinbound':''}" data-act="player" data-id="${pid}" title="${esc(playerLabel(pid))}"><strong class="jersey">${esc(jersey(pid))}</strong><small class="pname">${esc(playerName(pid)||t+'队')} · ${stats(t).players[pid]?.pts||0}分</small>${holder===pid?'<span class="ball">🏀</span>':''}</button>`}).join('');
 const act=(title,key,ico,cls='')=>`<button class="tool ${cls}" data-act="${key}">${title}<span>${ico}</span></button>`;
 const panelA=`<aside class="panel sidetools"><div class="sectionname"><b>进攻 · 投篮</b><span class="cap">OFFENSE</span></div>${act('两分命中','made2','↗','green')}${act('两分不中','miss2','↗','orange')}${act('三分命中','made3','◎','green')}${act('三分不中','miss3','◎','orange')}${act('进攻犯规','offFoul','⚑')}${act('无抢断失误','tov','↷')}<div class="sidefooter">点击同队球员 = 传球<br>点击对方球员 = 失误 + 抢断<br>当前持球人随节点高亮变化</div></aside>`;

function jumpStart(){const st=status();if(st.phase==='tipoff'){showOpeningJump();return}setFlow({title:'争球 / 交替拥有发球',subtitle:`场上当前状态：${st.phase==='held'?'持球争球':st.phase==='loose'?'篮板争球':'其他争球'} · ${st.arrow?`箭头→${st.arrow}队`:'尚未设置箭头'}`,html:`<div class="notice">按原持球状态确定失误或篮板；正常交替拥有发球完成后，箭头才翻转。裁判特殊判罚可选择实际获得发球权的球队，差异会标记核对。</div><div class="optiongrid"><button class="opt" data-act="jumpWinner" data-val="A">A队发球 ${st.arrow==='A'?'· 箭头推荐':''}</button><button class="opt" data-act="jumpWinner" data-val="B">B队发球 ${st.arrow==='B'?'· 箭头推荐':''}</button><button class="opt" data-act="arrow">人工修正箭头（裁判判罚）</button></div>`,buttons:[{title:'取消',action:'flowCancel'}],ctx:{phase:st.phase,holder:st.holder,arrow:st.arrow}})}
function jumpWinner(t){const c=flow.ctx;if(c.phase==='held'&&c.holder?.[0]!==t){pendingAdd('争球抢断归属',null,{note:`${c.holder}持球争球，${t}队获得球权，尚需指定抢断者`});emit('turnover',{team:c.holder[0],player:c.holder,label:'争球失去球权'});}if(c.phase==='loose')pendingAdd('争球篮板归属',null,{note:`${t}队获得球权，争球队员篮板尚未核实`});if(c.arrow&&c.arrow!==t)pendingAdd('争球箭头核对',null,{note:`箭头指向${c.arrow}队，裁判判${t}队发球；未自动改变箭头`});emit('jump',{winner:t,team:t,flipPending:!!c.arrow&&c.arrow===t});endFlow()}
function violationStart(){setFlow({title:'违例登记',subtitle:'除罚球内违例外，普通违例由裁判判罚决定球权。',html:`<div class="optiongrid"><button class="opt" data-act="violationType" data-val="走步">走步</button><button class="opt" data-act="violationType" data-val="24秒违例">24秒违例</button><button class="opt" data-act="violationType" data-val="其他违例">其他违例</button></div>`})}

function arrowStart(){if(status().phase==='tipoff'){showToast('请先完成开场跳球，再确定交替球权箭头');return}setFlow({title:'设置交替球权箭头',subtitle:'开场首次控制权确定后应指向另一队。',html:`<div class="optiongrid"><button class="opt" data-act="arrowCommit" data-val="A">下次A队</button><button class="opt" data-act="arrowCommit" data-val="B">下次B队</button><button class="opt" data-act="flowCancel">取消</button></div>`})}

function editOpen(evId,insert=false){const e=data.events.find(x=>x.id===evId);if(!e)return;const opts=[['pass','传球'],['steal','抢断+失误'],['shot_made','命中'],['shot_miss','投失'],['shot_fouled','被犯规投失'],['rebound','篮板'],['assist','助攻'],['block','盖帽'],['turnover','失误'],['foul','犯规'],['ft','罚球'],['unknown_team_points','未知得分'],['out','出界'],['inbound','指定发球人']];const sub=insert;let selected=insert?'pass':e.type;let draft=insert?{player:'A1',from:'A1',to:'A2',points:2,team:'A',period:e.period,clock:e.clock}:clone(e);
 const html=()=>`<div class="formgrid"><div class="field"><label>事件类型</label><select id="edType">${opts.map(([v,n])=>`<option value="${v}" ${selected===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>节次</label><input type="number" id="edPeriod" min="1" value="${draft.period}"></div><div class="field"><label>比赛剩余秒数</label><input type="number" id="edClock" min="0" value="${draft.clock}"></div><div class="field"><label>球队 A / B</label><select id="edTeam"><option ${draft.team==='A'?'selected':''}>A</option><option ${draft.team==='B'?'selected':''}>B</option></select></div><div class="field"><label>球员内部ID（如 A2，与球衣号无关）</label><input id="edPlayer" value="${esc(draft.player||'')}"></div><div class="field"><label>起点球员</label><input id="edFrom" value="${esc(draft.from||'')}"></div><div class="field"><label>终点球员</label><input id="edTo" value="${esc(draft.to||'')}"></div><div class="field"><label>分值（2 / 3 / 校正）</label><input type="number" id="edPoints" value="${Number(draft.points)||2}"></div><div class="field"><label>罚球命中（1 是，0 否）</label><select id="edMade"><option value="1" ${draft.made!==false?'selected':''}>是</option><option value="0" ${draft.made===false?'selected':''}>否</option></select></div><div class="field"><label>篮板：进攻 / 防守</label><select id="edOffensive"><option value="1" ${draft.offensive?'selected':''}>进攻篮板</option><option value="0" ${!draft.offensive?'selected':''}>防守篮板</option></select></div></div><div class="notice warn">修改或插入历史事件后，系统按事件顺序重新计算球权与助攻候选。无法自动补全的链路会进入“冲突”标记，不擅自虚构。</div>`;
 setFlow({title:insert?'插入历史事件':'编辑历史事件',subtitle:`关联时间轴事件 #${e.seq} · 保留事件日志顺序`,render:html,buttons:[{title:'取消',action:'flowCancel'},{title:'保存并重算',action:'editCommit',class:'strong'}],ctx:{eventId:evId,insert}})}
function editCommit(){const fields=['edType','edPeriod','edClock','edTeam','edPlayer','edFrom','edTo','edPoints','edMade','edOffensive'];const values=Object.fromEntries(fields.map(k=>[k,$('#'+k)?.value]));const src=data.events.findIndex(e=>e.id===flow.ctx.eventId);if(src<0)return endFlow();const target=flow.ctx.insert?{id:id(),seq:0}:clone(data.events[src]);const updates={type:values.edType,period:Number(values.edPeriod),clock:Number(values.edClock),team:values.edTeam,player:values.edPlayer||null,from:values.edFrom||null,to:values.edTo||null,points:Number(values.edPoints),made:values.edMade==='1',offensive:values.edOffensive==='1'};Object.assign(target,updates);if(flow.ctx.insert)data.events.splice(src,0,target);else data.events[src]=target;data.events.forEach((e,i)=>e.seq=i+1);data.nextSeq=data.events.length+1;save();endFlow();const count=replay().issues.length;if(count)showToast(`已保存，发现${count}条后续事件需要核对`);else showToast('修改已保存，统计已重新计算')}
function deleteOpen(evId){const ev=data.events.find(e=>e.id===evId);setFlow({title:'删除已提交事件',subtitle:label(ev),html:`<div class="notice warn">删除后会重新计算比分、个人统计和球权。关联任务可能成为孤立任务，必须重新核验。</div>`,buttons:[{title:'取消',action:'flowCancel'},{title:'确认删除',action:'deleteCommit',class:'danger'}],ctx:{eventId:evId}})}
function deleteCommit(){const ref=flow.ctx.eventId;data.events=data.events.filter(e=>e.id!==ref);data.events.forEach((e,i)=>e.seq=i+1);data.nextSeq=data.events.length+1;for(const p of data.pending)if(p.ref===ref)p.note='源事件已删除，请核验关联';save();endFlow()}
function undo(){if(!data.events.length)return;const last=data.events.at(-1);data.events.pop();data.pending=data.pending.filter(p=>p.ref!==last.id);data.nextSeq=data.events.length+1;save();render();showToast('已撤销：'+label(last))}
function resolveOpen(pid){const p=data.pending.find(p=>p.id===pid);if(!p)return;const src=data.events.find(e=>e.id===p.ref);if(p.kind==='助攻判定'&&src){setFlow({title:'补录助攻判定',subtitle:label(src),html:`<div class="notice">最后传球者：${src.assistCandidate||'未记录'}</div>${src.assistCandidate?`<button class="btn" data-act="resolveAssist" data-id="${p.id}" data-player="${src.assistCandidate}">助攻成立</button>`:''} <button class="btn" data-act="pendingDone" data-id="${p.id}">无助攻</button>`,ctx:{pid}});return}if(p.kind==='篮板归属'&&src){showRebound(p.ref);return}if(p.kind==='得分归属'&&src){setFlow({title:'未知得分归属',subtitle:`${src.points}分投篮归属未确认。`,render:()=>bothNodes('resolveUnknownScorer')+'<div class="notice">如果只确定球队，赛后可使用未知球员得分校正，不虚构投篮数据。</div>',buttons:[{title:'取消',action:'flowCancel'}],ctx:{pid,ref:p.ref}});return}
 setFlow({title:'待处理事件',subtitle:p.kind,html:`<div class="notice warn">${esc(p.note||'相关情况待人工核实')}</div><div class="notice">请选择确认已核实、保留待办，或到事件记录中编辑相关事件。</div>`,buttons:[{title:'稍后处理',action:'flowCancel'},{title:'已人工核对',action:'pendingGenericDone',class:'strong'}],ctx:{pid}})}
function pendingGenericDone(){pendingRemove(flow.ctx.pid);endFlow()}
function resolveUnknownScorer(pid){const p=data.pending.find(t=>t.id===flow.ctx.pid),ev=data.events.find(e=>e.id===p?.ref);if(!ev)return endFlow();ev.type='shot_made';ev.team=pid[0];ev.player=pid;ev.assistCandidate=null;data.pending=data.pending.filter(t=>t.id!==p.id);save();endFlow()}

// 球队与阵容：内部球员 ID 保持 A1/B6 等不变，改球衣号码不会破坏历史事件关联。
let rosterDraft=null;
function makeRosterDraft(){return {team:'A',teams:clone(data.teamMeta),players:clone(data.playerMeta),rosters:clone(data.rosters),lineups:clone(data.lineups)}}
function editorRead(){if(!rosterDraft)return;const t=rosterDraft.team;const nm=$('#editorTeamName');if(!nm)return;rosterDraft.teams[t].name=nm.value;rosterDraft.teams[t].color=document.querySelector(`input[name="kit-${t}"]:checked`)?.value||rosterDraft.teams[t].color;let count=Number($('#editorRosterCount')?.value)||12;rosterDraft.rosters[t]=BASE[t].slice(0,count);let starters=[];for(const n of BASE[t]){const pid=t+n;const jerseyInput=$(`[data-jersey="${pid}"]`),nameInput=$(`[data-pname="${pid}"]`),star=$(`[data-starter="${pid}"]`);if(jerseyInput)rosterDraft.players[pid]={number:jerseyInput.value.trim(),name:(nameInput?.value||'').trim()};if(star?.checked&&rosterDraft.rosters[t].includes(n))starters.push(n);}rosterDraft.lineups[t]=starters;}
function rosterEditorRender(){const d=rosterDraft,t=d.team;const locked=!!(data.events.length||data.pending.length);const count=d.rosters[t].length;const rowHtml=BASE[t].map((n,i)=>{const pid=t+n,p=d.players[pid];return `<div class="roster-columns roster-line ${i>=count?'off':''}" data-roster-row="${pid}" data-row-index="${i}"><span class="slot">${String(i+1).padStart(2,'0')}</span><input aria-label="${t}队第${i+1}位球衣号码" data-jersey="${pid}" type="text" inputmode="numeric" maxlength="2" value="${esc(p.number)}"><input aria-label="${t}队第${i+1}位球员姓名" data-pname="${pid}" type="text" maxlength="28" value="${esc(p.name||'')}" placeholder="姓名（可留空）"><label class="star"><input aria-label="${t}队第${i+1}位选首发" data-starter="${pid}" type="checkbox" ${d.lineups[t].includes(n)?'checked':''} ${i>=count||locked?'disabled':''}></label></div>`}).join('');
 const colors=KIT_COLORS.map(k=>`<label class="kitpick" style="--color:${k.hex}"><input type="radio" name="kit-${t}" value="${k.key}" ${d.teams[t].color===k.key?'checked':''}><i></i>${k.name}</label>`).join('');
 setFlow({kind:'roster',onCancel:()=>{rosterDraft=null},title:'球队与阵容 · 测试1',subtitle:'独立编辑队名、球衣颜色、姓名、球衣号码和首发阵容；号码改变不影响已记录比赛。',wide:true,html:`<div class="roster-teams"><button class="${t==='A'?'active':''}" data-act="editorSwitch" data-val="A">A队 · ${esc(d.teams.A.name)}</button><button class="${t==='B'?'active':''}" data-act="editorSwitch" data-val="B">B队 · ${esc(d.teams.B.name)}</button></div><div class="roster-head"><div class="field" style="flex:1;min-width:180px"><label>球队名称</label><input id="editorTeamName" type="text" maxlength="28" style="width:100%" value="${esc(d.teams[t].name)}"></div><label class="roster-count">报名人数 <select id="editorRosterCount" ${locked?'disabled':''}>${Array.from({length:8},(_,i)=>i+5).map(v=>`<option value="${v}" ${v===count?'selected':''}>${v}人</option>`).join('')}</select></label></div><div class="modalcap">球衣颜色 · 赤橙黄绿青蓝紫</div><div class="kit-colors">${colors}</div><div class="modalcap">队员名单 · 同队球衣号码不得重复</div><div class="roster-columns head"><span>名额</span><span>号码</span><span>姓名</span><span>首发</span></div><div id="rosterRows">${rowHtml}</div><div class="roster-notice">${locked?'⚠ 已有比赛事件，锁定报名人数与首发阵容，仍可修改队名、球衣颜色、球员姓名与号码。':'需选中恰好5名首发，未报名的队员不会在场上或替补名单中出现。'}<br>后台保留独立球员 ID，统计与历史事件不会随着号码变化而重新分配。</div>`,buttons:[{title:'取消',action:'rosterEditorCancel'},{title:'保存双方球队资料',action:'editorSave',class:'strong'}]});}

function editorCountChange(){const count=Number($('#editorRosterCount')?.value)||12;const t=rosterDraft?.team;for(const row of document.querySelectorAll('[data-roster-row]')){const enabled=Number(row.dataset.rowIndex)<count;row.classList.toggle('off',!enabled);const check=row.querySelector('[data-starter]');if(check){check.disabled=!enabled;if(!enabled)check.checked=false;}}}

function editorSave(){editorRead();const d=rosterDraft;if(!d)return;for(const t of ['A','B']){const name=d.teams[t].name.trim();if(!name){showToast(`${t}队名称不能为空`);return}d.teams[t].name=name;const jerseySet=new Set();for(const n of d.rosters[t]){const pid=t+n,p=d.players[pid];if(!/^(?:00|0|[1-9][0-9]?)$/.test(p.number)){showToast(`${t}队第${BASE[t].indexOf(n)+1}位的球衣号码应为0–99或00`);return}if(jerseySet.has(p.number)){showToast(`${t}队球衣号码 #${p.number} 重复`);return}jerseySet.add(p.number)}if(d.lineups[t].length!==5&&!data.events.length){showToast(`${t}队需要且仅需要5名首发球员`);return}}
 data.teamMeta=d.teams;data.playerMeta=d.players;if(!data.events.length&&!data.pending.length){data.rosters=d.rosters;data.lineups=d.lineups;}
 rosterDraft=null;save();endFlow();showToast('双方球队资料已保存')}
function settingsOpen(){setFlow({title:'比赛设置与数据管理',subtitle:'自定义节数、每节时间及加时长度；更改只影响未来新节次。',html:`<div class="formgrid"><div class="field"><label>常规节数</label><input id="cfgPeriods" type="number" min="1" max="8" value="${data.config.periods}"></div><div class="field"><label>每节分钟</label><input id="cfgMinutes" type="number" min="1" max="30" value="${data.config.periodMinutes}"></div><div class="field"><label>加时分钟</label><input id="cfgOT" type="number" min="1" max="20" value="${data.config.otMinutes}"></div><div class="field"><label>当前计时剩余秒</label><input id="cfgClock" type="number" min="0" value="${Math.ceil(data.clock)}"></div></div><div class="modalcap">比赛数据</div><div class="row"><button class="btn" data-act="unknownPoints">比分校正 / 未知球员</button><button class="btn" data-act="import">导入JSON</button><button class="btn danger" data-act="reset">清空演示</button></div><input id="importFile" type="file" accept="application/json,.json" class="hide">`,buttons:[{title:'取消',action:'flowCancel'},{title:'保存设置',action:'settingsSave',class:'strong'}]})}

function resetOpen(){setFlow({title:'清空当前演示数据？',subtitle:'此操作无法撤销，建议先导出JSON。',buttons:[{title:'取消',action:'flowCancel'},{title:'确认清空',action:'resetCommit',class:'danger'}]})}
function resetCommit(){data=newData();hydrateMeta();save();endFlow()}
function finalizeOpen(){const open=data.pending.length+replay().issues.length;setFlow({title:'赛后核对 / 完赛',subtitle:'允许保留待核验差异；由记录员决定结束或加时。',html:`<div class="notice ${open?'warn':''}">当前比分 ${stats('A').score}:${stats('B').score}，待办 ${data.pending.length} 项，事件链冲突 ${replay().issues.length} 项。</div><div class="optiongrid"><button class="opt" data-act="finalSave">保存待核验</button><button class="opt" data-act="periodNext">进入加时/下一节</button><button class="opt" data-act="downloadJSON">导出JSON</button></div>`})}
function finalSave(){data.running=false;save();endFlow();showToast('已保存，待核验事件保留')}
function tick(){if(!data.running)return;const now=Date.now(),elapsed=Math.max(0,(now-data.clockUpdated)/1000);data.clockUpdated=now;if(data.clock<=0){data.clock=0;data.running=false;save();render();return}data.clock=Math.max(0,data.clock-elapsed);const time=$('#timeText');if(time)time.textContent=clockFmt(data.clock);if(!data.clock){data.running=false;save();render()}}
function handle(act,btn){const val=btn.dataset.val,pid=btn.dataset.id;if(interruptState&&act!=='interrupt'&&act!=='interruptResume')return;
 if(act==='interrupt'){beginInterruption();return}if(act==='interruptResume'){interruptResume();return}
 if(flow){const permitted=new Set(['flowCancel','choosePlayer','assistChoice','madeFoulChoice','commitMadeDetails','illegalScorer','illegalLater','missFoul','missNormal','blockChoice','noBlock','deferBlock','cancelShotMiss','reboundPick','reboundOut','outWinner','reopenRebound','noRebound','reboundLater','reboundCancel','resumePick','commitTov','outType','foulContext','foulOffender','foulSubtype','foulCount','foulDetailsNext','foulFtPlayer','foulBack','retainTeam','forcedSub','forcedNoSub','ftSubOpen','ftSubSkip','ftResult','ftUndo','ftCancel','ftConfirm','ftViolation','ftViolationChoice','ftViolationBack','violationGoBack','subTeam','subOut','subIn','subRemove','subCommit','subSkip','timeoutCommit','periodEnd','periodNext','finalize','finalSave','firstJumpPlayer','jumpRetake','tipViolationStart','tipViolationWinner','jumpBack','jumpWinner','arrow','violationType','arrowCommit','editCommit','deleteCommit','pendingDone','pendingGenericDone','resolveAssist','resolveUnknownScorer','settingsSave','editorSwitch','editorSave','rosterEditorCancel','unknownPoints','unknownPointsCommit','downloadJSON','downloadCSV','downloadStatsCSV','reset','resetCommit','import']);if(!permitted.has(act)){showToast('当前事件窗口尚未完成，请先确认或取消');return}}
 switch(act){case'player':playerClick(pid);break;case'made2':shotMade(2);break;case'made3':shotMade(3);break;case'miss2':startMiss(2);break;case'miss3':startMiss(3);break;case'defFoul':foulStart('defense');break;case'offFoul':foulStart('offense');break;case'otherFoul':foulStart('other');break;case'tov':turnoverWithoutSteal();break;case'out':outStart();break;case'violation':violationStart();break;case'jump':jumpStart();break;case'timeout':timeoutStart();break;case'sub':openSubs();break;case'period':periodStart();break;case'arrow':arrowStart();break;case'undo':undo();break;case'export':exportOpen();break;case'settings':settingsOpen();break;case'teamEditor':rosterEditorOpen();break;case'tab':data.tab=val;render();break;case'statTeam':data.statTeam=val;render();break;case'clock':data.running=!data.running;data.clockUpdated=Date.now();save();render();break;case'edit':editOpen(pid);break;case'insert':editOpen(pid,true);break;case'delete':deleteOpen(pid);break;case'resolve':resolveOpen(pid);break;case'flowCancel':flowCancel();break;
 case'assistChoice':flow.ctx.chooseAssist(val);drawModal();break;case'madeFoulChoice':flow.ctx.chooseFoul(val);drawModal();break;case'commitMadeDetails':{const c=flow.ctx,{assist,foul}=c.get(),e=data.events.find(x=>x.id===c.ref);if(assist==='yes'&&e.assistCandidate)emit('assist',{team:e.team,player:e.assistCandidate,ref:e.id});if(assist==='later')pendingAdd('助攻判定',e.id,{note:'投篮命中的助攻尚未确认'});if(foul==='yes')foulStart('defense',{shooter:e.player,defaultFt:1,shotRef:e.id});else endFlow();break}
 case'illegalScorer':illegalScorer(pid);break;case'illegalLater':illegalLater();break;case'missFoul':missFoul(btn.dataset.player,Number(btn.dataset.pts));break;case'missNormal':missNormal(btn.dataset.player,Number(btn.dataset.pts));break;
 case'blockChoice':blockChoice(pid);break;case'noBlock':noBlock();break;case'deferBlock':deferBlock();break;case'cancelShotMiss':cancelShotMiss();break;case'reboundPick':reboundPick(pid);break;case'reboundOut':reboundOut();break;case'outWinner':outWinner(val);break;case'reopenRebound':reopenRebound();break;case'noRebound':noRebound();break;case'reboundLater':reboundLater();break;case'reboundCancel':reboundCancel();break;case'resumePick':emit('resume',{player:pid,team:pid[0]});endFlow();break;case'commitTov':commitTov();break;case'outType':outType(val);break;
 case'foulContext':{const x=flow.ctx;foulStart(x.kind,{...x.extra,attackTeam:val});break}case'foulOffender':foulOffender(pid);break;case'foulSubtype':foulSubtype(val);break;case'foulCount':foulCount(Number(val));break;case'foulBack':foulBack();break;case'foulDetailsNext':foulDetailsNext();break;case'foulFtPlayer':foulFtPlayer(pid);break;case'retainTeam':{flow.ctx.retainTeam=val;showFoul(flow.ctx);break}case'forcedSub':forcedSub(Number(val));break;case'forcedNoSub':forcedNoSub();break;case'ftSubOpen':ftSubOpen();break;case'ftSubSkip':ftSubSkip();break;case'ftResult':ftResult(val);break;case'ftUndo':ftUndo();break;case'ftCancel':ftCancel();break;case'ftViolation':ftViolation();break;case'ftViolationChoice':ftViolationChoice(val);break;case'ftViolationBack':ftViolationBack();break;case'violationGoBack':violationGoBack();break;case'ftConfirm':ftConfirm();break;
 case'subTeam':subTeam(val);break;case'subOut':subOut(Number(val));break;case'subIn':subIn(Number(val));break;case'subRemove':subRemove(btn.dataset.team,Number(btn.dataset.index));break;case'subCommit':subCommit();break;case'subSkip':subSkip();break;case'timeoutCommit':timeoutCommit(val);break;case'periodEnd':periodEnd();break;case'periodNext':periodNext();break;case'finalize':finalizeOpen();break;case'finalSave':finalSave();break;case'firstJumpPlayer':tipControl(pid);break;case'jumpRetake':jumpRetake();break;case'tipViolationStart':tipViolationStart();break;case'tipViolationWinner':tipViolationWinner(val);break;case'jumpBack':showOpeningJump();break;case'jumpWinner':jumpWinner(val);break;case'violationType':violationType(val);break;case'arrowCommit':arrowCommit(val);break;
 case'editCommit':editCommit();break;case'deleteCommit':deleteCommit();break;case'pendingDone':pendingRemove(pid);endFlow();break;case'pendingGenericDone':pendingGenericDone();break;case'resolveUnknownScorer':resolveUnknownScorer(pid);break;case'resolveAssist':{const p=data.pending.find(p=>p.id===pid),e=data.events.find(e=>e.id===p?.ref);if(e){emit('assist',{team:e.team,player:btn.dataset.player,ref:e.id});pendingRemove(pid)}endFlow();break}case'settingsSave':settingsSave();break;case'editorSwitch':editorSwitch(val);break;case'editorSave':editorSave();break;case'rosterEditorCancel':rosterEditorCancel();break;case'unknownPoints':unknownPointsOpen();break;case'unknownPointsCommit':unknownPointsCommit();break;case'downloadJSON':downloadJSON();break;case'downloadCSV':downloadCSV();break;case'downloadStatsCSV':downloadStatsCSV();break;case'reset':resetOpen();break;case'resetCommit':resetCommit();break;case'import':$('#importFile')?.click();break;default:showToast('未处理动作：'+act)} }
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;const inDialog=b.closest('#dialog');if(flow&&!inDialog&&act!=='interrupt'){showToast('当前窗口处于独占交互状态');return}handle(act,b)});
document.addEventListener('change',async e=>{if(e.target?.id==='editorRosterCount'){editorCountChange();return}if(e.target?.id==='importFile'){const file=e.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(parsed.version!==3||!Array.isArray(parsed.events))throw new Error('文件不是CourtFlow V0.3格式');data=parsed;hydrateMeta();data.running=false;save();endFlow();showToast('比赛数据已导入')}catch(err){showToast('导入失败：'+err.message)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&flow&&!interruptState){if(flow.kind==='roster')rosterEditorCancel();else flowCancel();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!flow){e.preventDefault();undo()}});
setInterval(tick,400);data.running=false;render();
</script></body></html>
